[TailLight]
; The tail lamp's light (2026-11-01a; test 47: "you can tell it's on, but it's not producing light"):
; the lens's lit shell glows, but a glowing material lights nothing in this game, so the controller
; script places a small light (CMB_TailLight: a shadowless red spot, radius 220, about 3 m) and the
; plugin keeps it at the lamp every frame, as it does the headlamp's: aimed back and down so it lights
