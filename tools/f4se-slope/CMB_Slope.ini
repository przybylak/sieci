WallAngle=55
; A face this steep or steeper (degrees), or the climb limit if that is higher, is an
; obstacle; under it, a slope the bike climbs, no verdict (test 37: ten of 39 throttle holds
; in a ride were faces of 45 to 49 degrees, over the rays' climb value of 45, which the
; controller climbs at 47). Walls stay at WallAngle.
ObstacleAngle=50
; A lower-only obstacle (something at axle height, nothing at 1.5 wheel radii; its slope is
