[Parts]
; The moving parts of the Sketchfab build (the wheels spin with the distance ridden, back when
; reversing; the bar assembly turns with the rider's turning, and the riding clips put the
; hands where the turned bars are). Where the axles, the steering axis and (since the 2026-10-31a
; build) the speedometer's needle (NeedlePoint, NeedleAxis, NeedleZero, NeedleMax, NeedlePerMph;
; without the first two the needle stays at rest) are comes from CMB_BikeParts.ini, which the mesh
; tool (tools/rider) writes next to the meshes (Data\Meshes\CMB); File= is its path relative to this
; DLL's folder, and the keys can also go in this section instead. Without the file nothing on the
; bike moves (the vanilla bike, a single shape, never does). BarFullAt: the turning rate (degrees a
; second) at which the bars are fully over (BarAngle in the parts file, 10 by default); only a real
; turn takes them all the way (test 22: at 45 every heading correction did, and the straight-riding
; clips' hands came off the grips); a creep turn from a stop is 60 a second, two thirds. Backing up
; with a side key the rear goes the key's way and the nose the other, as a car reverses, so the bars
; turn the key's way, where the front wheel points (test 38: they followed the nose, "when going
; back and turning left motorcycle handlebars should also turn left").
File=..\..\Meshes\CMB\CMB_BikeParts.ini
BarFullAt=90
; At speed the bars go over this much of BarAngle (full to 150 units a second, down to this
; by 400): a bike's bars barely move at speed, and the riding clips' lean poses (jog and up)
; put the hands where the bars are at this fraction.
BarAtSpeed=0.6
; Which part each of the worn bike's shapes is (28 shapes since the 2026-10-31a build, one per
; material and moving part; 27c had 12): 1 = by the tag in its name first, the mesh tool's labels
; (_static_ a fixed part, _rear_tail and _rear_brake the lights' shells, _front_ the bar assembly,
; _front_glow the lamp's lit parts, _front_dialglow the dial's backlight, _front_needle the needle,
; _front_mirrorStock, _front_mirrorUnderEgg and _front_mirrorUnderD the mirrors, _fork the lower
; fork, _wheelF and _wheelR the wheels), then a name without a tag by 27c's rules; 27c's names give
; 27c's parts either way, so its meshes copied back over look and move as 27c's. 0 = 27c's rules
; alone: only _fork by name, the rest by where each shape's culling sphere sits (on an axle a wheel,
; ahead of FrontMinY the bar assembly, small and by the lamp the lamp's lit parts); with this
; build's meshes the needle then stays at rest, and the lights, the dial's backlight and all three
; mirrors always show, whatever the [Speedo], [Tail] and [Look] keys say (0 is for 27c's meshes).
; Up to 48 of the bike's shapes are held (16 before this build); the log names any past that, once
; a ride.
RolesByName=1
; 2026-11-09a (test 50: "the wheels should lock when braking and stop with the bike"). WheelSpin: the wheels turn by
; the bike's own movement each frame along its heading (exact rolling), so they stop on the frame the bike stops, and
; not at all under WheelStill (units a second, 0-50: the capsule's settling jitter); without the steering, by the
; quick speed. 0 = by the 0.2 s speed, the 2026-11-08a build (they ran on after a stop). WheelLock: no turning while
; braking (the back key or the brake key at speed; reversing turns them backward as before). 0 = they turn while braking
; (the 2026-11-08a build). The speedometer's needle keeps its easing ([Speedo] Tau). Read again on getting on.
WheelSpin=1
WheelStill=5
WheelLock=1

[Lamp]
; The headlamp (test 29's wish). The lens's lit parts are a shape of the bar assembly
; (CMB_BikeWorn*.nif), shrunk to a speck while the lamp is off (since the 2026-10-31a build the
; speedometer's backlight with them: [Speedo] Backlight). The beam is the light reference
; the controller script places at the rider on getting on, enabled while CMB_HeadlampLive is 1
; (the MCM's Headlamp: off, on, or on at night; the hotkey switches it while riding): the plugin
; puts its 3D at the lens every frame, with the bars' turn and the tilt, Ahead units out along
; the beam, and hands it over to the new reference the script places on a cell change (tests
; 32 to 35: no blackouts, with or without shadows). The other way, a lamp piece (an unskinned
; nif in biped slot 58 carrying the ADDN records' add-on nodes, which the plugin would keep at
; the lens the same way) never reached the player's 3D in tests 32 to 35 and is gone from the
; mod; the plugin still looks for add-on nodes on the worn bike's nif and would keep one at
; the lens, but no nif carries any now. Enabled=0 leaves the light alone. The log's "lamp:"
; lines say where the lens was put and what was handed over.
Enabled=1
; Only for a kept add-on node, should a worn nif carry some: 1 = the shadow-casting light's
; node, 0 = the plain one's (the placed reference follows the MCM's "Headlamp casts shadows"
; instead).
Shadows=0
; Which of the node's own axes the beam runs along (x, y or z, a - in front for the other way).
; Gamebryo's lights shine down their node's +X. If the beam goes sideways or up, change this.
BeamAxis=x
; The beam dipped this many degrees (a bike's dipped beam: 2 to 4).
Pitch=2
; The light is placed this many units ahead of the lens along the beam (test 34: the beam
; blacked out for a frame when the light fell inside the lamp housing on fast frames; out
; there it lights the same and the housing can't swallow it).
Ahead=28
; The light is also moved on by this many frames of the bike's speed along the heading (the
; renderer uses the transform a frame late). 0 = none.
Lead=1
; At a handover the old light is kept at the lens this many frames after the new one has
; its 3D (the renderer lights with a new 3D a few frames after it exists).
HandoverFrames=5
; Where NiAVObject keeps its flags (bit 0 hides the node), for this game version's layout
; (1.11.240: +0x108; +0x100 is the collision object, test 30).
FlagsOffset=0x108

[Speedo]
; The speedometer (the 2026-10-31a build; "if possible with actually working speedometer"): the
; dial's needle turns clockwise with the speed along the heading, from its rest at the 0 mark
; (NeedleZero past it), NeedlePerMph degrees a dial mph up to NeedleMax, about NeedleAxis through
; the hub (NeedlePoint; the keys are CMB_BikeParts.ini's), then with the bars and the tilt like the
; rest of the bar assembly. The trace's "parts:" line says where (ndl=, degrees). 0 = the needle
; shrunk to a speck at its hub, as 27c had none.
Needle=1
