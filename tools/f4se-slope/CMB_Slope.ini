; Commonwealth Motorbike - CMB_Slope.dll (F4SE plugin): steeper slopes, a farther camera and
; a bike that tilts with the ground and turns like one while riding, and the ground under you
; for parking the bike; since test 44's build the engine's sound too, its loops pitched and
; faded every frame from a gearbox model ([Sound], at the end); since the 2026-10-31a build the
; speedometer's needle, the tail and brake lights, the mirrors' choice ([Speedo], [Tail], [Look]).
; How steep, how far, how much: MCM menu ("Steepest slope while riding", "Riding camera
; distance", "Bike tilts with the ground", "Turning radius"...), or in the console
; "set CMB_MaxSlope to 60", "set CMB_RidingCameraDistance to 450", "set CMB_MaxTilt to 15",
; "set CMB_TurnRadius to 180". 0 turns any of them off.
; The log is Documents\My Games\Fallout4\F4SE\CMB_Slope.log.

[Slope]
; Where the slope limit is: in the character controller or its Havok proxy, at which byte
; offset, stored how (cosine, radians or degrees). Found with Probe=1 (tests 5 and 6).
Target=controller
SlopeOffset=0x418
SlopeUnit=cosine
; Only touch it if it holds this angle (degrees) when you get on; 0 = any plausible value.
; A safety check against game updates that move things around.
ExpectedDegrees=47

; 1 = log the controller, the proxy and the objects at these controller offsets, and what
; changes on getting on, 1 and 3 seconds into the ride, and getting off.
Probe=0
DumpPointers=0x2B8

; How often to check, in milliseconds (while riding the limit and the tilt are also kept
; every frame).
IntervalMs=100

[Camera]
; The game setting that says how far back the third-person camera sits.
Setting=fVanityModeMaxDist:Camera
; 1 = on getting on, zoom the third-person camera all the way out (the old zoom comes back
; on getting off). The zoom is a fraction (0 nearest, 1 farthest) at these offsets of the
; game's ThirdPersonState; only written if both read as fractions (the log says).
ZoomOut=1
ZoomTargetOffset=0xE8
ZoomCurrentOffset=0xEC

[Tilt]
; Where the character controller keeps the normal of the ground under the player (its
; support normal) and Havok's character state (0 on the ground, 1 jumping, 2 in the air...).
; In the air the bike eases back to level. 0 = don't read it (the tilt then needs the normal only).
NormalOffset=0x1E0
StateOffset=0x2C0
; The bike's pitch comes from two rays cast down at the wheels' contact patches (the axles
; from CMB_BikeParts.ini; from 70 above the feet to 160 below): the line between the two
; hits, so a lip under the front wheel or a crest lifts the nose the moment a wheel is on it
; (test 29: the track lagged there and the bike sank into slopes). Where a ray finds nothing
; (no Address Library, a ledge) the slope of the track just ridden (the last 120 units, along
; the heading) stands in, and for the first metre of a ride the ground's normal; the roll is
; always the normal's: the median of the last MedianTime seconds (drops one-frame contacts
; with a curb or a lip of rock). When the ground between the wheels is above the capsule's
; contact (a dip, a lip under the front) the bike is lifted onto the rays' line (up to 60
; units), and lowered only by the suspension's droop (SuspDroop, below). The two rays pass
; through actors, their capsules (layer 30) and bodies (8), as the reverse's ground rays do
; (test 39: a radstag in front, the front ray hit its capsule 107 above the feet and the bike
; reared up at it for 0.6 s; one that runs out of its 8 tries on an actor counts as finding
; nothing, not the actor's last point); the face rays still stop at one ahead. Where the rays have
; no word the lift is held with the pitch for 3 s before it eases off (test 38: backing off
; a station wagon the front wheel had climbed, the rays missed, the pitch was kept at 41.5
; while the lift fell from 34 to 0 within a quarter second, and the rear wheel went under
; the ground: "going back was putting half of the bike underground"; 3 s covers a slow
; back-off, and a tunnel's ceiling, which throws the rays' hits away for as long as it
; lasts, mustn't float the bike on a stale lift). The pitch holds in the air (counted only after 50 ms off the
; ground: the state flaps for a frame or two over bumps) and, where the rays miss, standing
; still. Both angles follow their target through a critically damped spring that settles in
; about Smoothing seconds (no overshoot, no saw-tooth when the source changes) and moves at
; most MaxRate degrees a second. The log's "rays: the wheels' rays" lines (test 38, for the
; roof and ledge cases) give each ray's hit, what it hit and its layer, under a pitch of 25
; degrees or more or with a wheel hanging at its droop under one over 10, and a hit thrown
; away as above the ray's allowed rise says what it was; one a second at most, from a hand
; of 10 lines refilled by one every 6 s (10 a minute, sustained), full again on each ride,
; and while backing from a hand of their own (test 39: the 30 a ride were spent by 01:35:02,
; before the backing tests).
MedianTime=0.25
Smoothing=0.25
MaxRate=90
; Degrees the bike may roll across a slope (a two-wheeler stays upright: 0). Pitch goes up
; to the MCM's "Bike tilts with the ground" (45 by default since test 29, the climb limit:
; at 20 the front wheel went into anything steeper by the difference).
MaxRoll=0
; Leaning into turns (test 31's wish: the rider in line with the bike in bends): the
; centripetal lean, atan(v w / g) for the speed and the turning rate (none at a creep, full
; from 150 units a second), on top of the ground's roll; the rider leans with the bike.
; Test 32: a side key asks 300 degrees a second at once and the lean sat at the cap, jumping
; 18 degrees between quarter seconds. So the turning rate is smoothed over LeanSmooth seconds
; first, v w / g (the tangent of the physical lean) under LeanDead gives nothing (a small
; correction barely leans), the lean is LeanGain of the physical one, at most MaxLean degrees
; (0 = none), and it changes at most LeanRate degrees a second (test 34: 30 lagged the eased
; key turn). All read again on getting on.
MaxLean=14
LeanRate=50
LeanSmooth=0.45
LeanDead=0.08
LeanGain=0.5
; 1 = the head stays level with the horizon as the bike rolls (the face, the eyes and anything
; on the head with it; its pitch still goes with the bike). 0 = the head tilts with the bike.
HeadLevel=1
; The upper body (test 32: the clips pose the arms locked straight, the grips at the arms'
; full reach, so a turn put the far grip out of reach and the wrist stretched). It leans
; forward about the lowest spine bone's joint by TorsoLean degrees (-1 = by enough to bring
; the straight grips to ArmReach of the arms' reach, solved once a ride, up to 30 degrees;
; 0 = not at all; test 38: 0.88 gave 6 to 9 degrees, about 1.4% of the reach a degree, and
; "character should lean forward a bit more", so 0.80, about 14; the reference riders on a
; bike of this shape sit 30 to 40 degrees forward of vertical),
; turns toward the far grip by TorsoTwist of the bars' angle (0 = not at all; test 36: at
; 0.4 the inner arm folded tight at full lock, its elbow pushed out and back, the chest only
; 5 degrees round: the inner grip comes back by the grip's radius and the inner shoulder
; should go back with it, so 0.75), and leans toward the inside of the turn by TorsoSideLean
; degrees per degree of the bars, about the forward axis through the same joint (0 = not at
; all; test 36: "the body doesn't lean or shift sideways, so the arms have no room"); the
; arms are solved from the moved shoulders, the hands stay on the grips, the head keeps its
; pitch and stays level. Read again on getting on. RiderHands=0 turns these off too.
; The lean is solved TorsoSolveFrom seconds into the ride (1.3; half a second before test 40:
; the first reading caught the getting-on blending out, below, and a rider who rode off at once
; gave no other reading of the riding pose, so that one was final) and again every half second
; till it is final
; (the pose settles), from the grips' distance as the clips pose it, the solve from the largest
; distance seen kept (a reading of the riding pose, 99% or more, replaces the one before it in
; any case, the later being the more settled). It is final once two readings of the riding
; pose in a row agree within a degree, or 3 s into the ride with the best seen (counted from
; half a second before the first reading of 95% or more, if that came later). Test 39: the
; first reading of 95% or more was the one kept: after two fast travels the grips read 95%
; and the lean was 11.1 and 11.4 degrees for the rest of the ride, against the riding pose's
; 14.6 at 100%; and at five of its six ride starts the first reading, 0.8 or 0.9 s in, read
; 100% with 15.9 to 21.1 degrees, the getting-on still blending out (14.6 half a second
; later), so one reading of the riding pose isn't final on its own. A reading short of the
; kept one changes nothing. Not while the arm bones are
; on the move (over 10 units in a frame) nor while that distance is under 95% of the arms'
; reach (the riding clips put the grips at 100%: a menu or a raised arm poses them nearer;
; test 37: the Pip-Boy opened a second after getting on read 82% and solved a lean of 0 that
; stuck for five minutes, through a fast travel). The short reach is logged once ("not solved
; yet") and tried again every half second; after 20 s of it the solve is taken as it comes,
; and not as final: the reach is measured again every half second, the lean solved again
; when it moves by over 3%, and once the riding pose is there the readings start again from
; it, the best kept as above (test 38: a Pip-Boy held open over 20 s right after getting on
; would have locked the 0 lean in for the ride). Solved afresh after a load and whenever the
; whole rider is let go and held again (a knock-off), and again, the lean kept meanwhile and
; the readings started again, after a jump of the player over 300 units from the ground (a
; door, a fast travel: test 38 found a fast travel on the bike leaves the rider's shapes held
; and loads nothing, so the lean was never solved again after one; a hop at speed lands over
; 150 from its last track point, and a cell load's stall can carry a frame that far, so
; neither counts). After a jump the readings start from the solve before it, when that came
; from a reading of 95% or more and wasn't taken as it comes: a reading has to beat it by
; half a percent, or be one of the riding pose, and 3 s on it is final as it stands ("the
; solve from before a jump of N units ... stands" in the log). Test 39: the grips read the
; riding pose's 100% only with the bike stopped (96 to 98% riding), and both fast travels
; arrived moving, the grips at 92 to 95%, so readings started from nothing ended final on a
; moving one, 11 to 12 degrees against the ride's 14.6. A solve taken as it comes (a Pip-Boy
; held open at the start, test 38) isn't kept: the readings after the jump start from nothing.
TorsoLean=-1
TorsoSolveFrom=1.3
ArmReach=0.80
TorsoTwist=0.75
TorsoSideLean=0.25
; The wrist (test 37: with the hand keeping the clips' orientation turned with the bars and
; the forearm swung by the lean and the re-solved elbow, the wrist read 25 degrees from the
; clips' pose at the straight bars, 42 to 46 on the inner wrist with the bars 8 over; test 39:
; "cat paw", the fists bent down at the wrist: the clips gave the hand a fixed frame, the
; fingers 39 degrees below level whatever the forearm did, and the roll of old, the forearm's
; own twist about the grip, kept that bend once ArmReach and ArmPole had the forearms about
; level). The hand (the fingers with it) is rolled round the grip's axis, the bars' lateral
; axis, so that its long axis (the hand's joint to the middle finger's knuckle, measured on the
; vanilla skeleton), seen along the grip's axis, lies in line with the forearm (the solved elbow
; to the wrist), HandPitch degrees above it, WristRoll of the way. The grip is round, so the
; palm stays on it and the fingers stay wrapped. The pivot is the grip's centre (Grip in the
; parts file; test 38: it was the hand's node, 6.5 units from the grip's centre, so the palm
; swung 2 x 6.5 x sin(theta/2) off the bar, 1.5 units at the ride's 13 degrees): the roll moves
; the wrist round the grip, so the arm is solved again to the wrist the roll puts there and
; the angle read off that forearm, till they agree within 0.2 degrees (six passes at most;
; with no Grip line the pivot is the hand's node, as before, and the wrist doesn't move). The
; arm's solve logs the roll, the hand's axis against the forearm's and the wrist's turn from
; the clips' pose; the ride's end logs the largest turn of the ride per wrist, from the steady
; frames alone (test 39: a ride ended by a fast travel logged 136.7 and 161.0 degrees, the
; grip at 101% and 116% of the reach: menu or loading frames): the arms still (under 5 units
; a frame), the grip at 50 to 103% of the reach, a second or more from the ride's start and
; from a jump of the player, and the clips holding the hand at the bars, their wrist within
; 12 units of the grip's centre (the riding clips put it 6.5 from it; the Pip-Boy's raise
; moves it tens of units off, test 37's 40.7 in a frame, and test 39's 136.7 degrees, with the
; map open for the fast travel, came at 101% of the reach, inside the band; without a Grip
; line that last check isn't made). 1 = the full
; alignment; 0 = off (the hand keeps the clips' orientation, turned with the bars, as before
; WristRoll).
WristRoll=1.0
; The hand's pitch against the forearm, in degrees, -45 to 45 (+ = the knuckles up, the wrist
; bent back, on either hand; - = down): where the roll above lays the hand's long axis, seen
; along the grip, against the forearm's line. 0 = in line with it (test 39's suggestion);
; scaled by WristRoll like the rest of the roll. Read again on getting on.
HandPitch=0
; The elbows (test 38: "keep elbows a lower"; in the video the elbow stood at shoulder height
; and out, the arm running almost level from the shoulder, where riders on a bike of this
; shape have the upper arms 35 to 45 degrees below level, the elbows bent and tucked under the
; shoulders, the forearms near level to the grips). Each arm bends the way ArmPole points, in
; the bike's space (x to the rider's right, y forward, z up), the right arm's, the left
; mirrored in x: since test 41 out as much as down and a little back (test 38's, the clips'
; own pole, mostly down, a little out and back). The direction is projected across the line
; from the shoulder to the grip; within 5 degrees of that line it says nothing and the arm's
; own plane is used. 0,0,0 = each arm keeps the plane the clips pose its elbow in (the old way:
; the clips' pole before test 38 pointed mostly sideways, so every bit of bend the shorter
; reach added pushed the elbow further out).
; Test 40: the upper arm went down and forward and the forearm rose to the grip; the tester's
; sketches have the elbows a little out, low under the shoulders, the forearms level, and a
; level forearm matters more than the elbow under the shoulder (test 41's answer). Both can't
; be had without moving the shoulders or the grips: the grips sit 9 to 11 below the
; shoulders, and an upper arm hanging straight down drops its whole 18.2. Test 41 (the arm
; emulation of the plugin's solve on the rig and the clips, within 0.6 deg of test 40's first
; solve): at 1.1,-0.3,-0.9 the elbow is 14.1 out of the shoulder and 11 below it, the upper arm
; 37 to 38 degrees below level, the forearm rising 3.7 degrees to the grip at the walk clip and
; 5.9 at the run; at 1.0,-0.3,-1.0 the elbow 13.2 out and 12 below, the forearm 6.2 and 8.7; at
; test 40's 0.35,-0.3,-1.0 the elbow 9 out and 15 below, the forearm 14.4 and 17.7. Chosen from
; a search about 1.0,-0.3,-1.0 for the flattest forearm with the elbow at most 1 further out
; (14.2: the wide elbows were test 38's complaint); the pole only picks the plane about the
; shoulder-to-grip line, so poles giving the same elbow give the same arm. At a stop (the idle
; clip, which rolls the bike 9 degrees) the elbows 11.9 and 15.4 out, the forearms 0.9 and 2.4.
; The cost: the wrist's turn from the clips' pose at the straight bars rises to 17.5 degrees at
; the walk and 16.2 at the run (10.8 and 9.8 at test 40's pole), the hand still in line with the
; forearm (WristRoll). The arm lines in the log give the elbow from the shoulder, the upper arm
; below level and the forearm's pitch seen from the side, in the bike's space, at the first
; solve and ("the arms riding") once at speed with the bars straight. 0.35,-0.3,-1.0 = test 40's
; arms.
ArmPole=1.1,-0.3,-0.9
; The inside arm in a turn (the one on the side the bars turn to, whose grip comes back toward
; the shoulder): with the elbow out it folds outward and its wrist turns more (the emulation,
; the run clip with the bars 12 over: 52 degrees from the clips' pose against 31 at test 40's
; pole). Its pole fades to ArmPoleTurn as the bars turn its way, all of it at ArmPoleTurnBars
; degrees of the bars (0 to 45), both poles taken as directions: with these the inside wrist is
; 21 degrees at 4 of the bars, 24 at 8 and 31 at 12 (test 40's), while the outside arm keeps
; ArmPole (18 at 12, 29 at test 40's pole). The inside elbow comes in about 4 units over the
; first 10 degrees of the bars, eased with them. 0,0,0 (or ArmPoleTurnBars=0) = no fade,
; ArmPole in every turn. Read again on getting on.
ArmPoleTurn=0.35,-0.3,-1.0
ArmPoleTurnBars=10
; A bump under a wheel (test 33: the tyres sank into small hills, stones and curbs that passed
; under a wheel before the median and the spring reacted): whichever wheel would sit below its
; own ray's hit, with the pitch and lift as applied, is lifted out, straight to what it lacks,
; never more than BumpMax units in one go (a wheel radius; up to 1.5 radii while the rays ahead
; say an obstacle is being ridden over, as high as they let one be, and kept that wide while
; the bump is above BumpMax: test 35's 35 to 45 unit stone passed as an obstacle while the
; bump stopped at 30; the pitch takes the wheel onto a step within a third of a second, so the
; bump is the first instant's and the rate below bounds it anyway), and the lift settles over
; BumpSettle seconds as the filtered pitch and lift catch up or the bump passes. BumpMax=0 turns the bump lift off. The whole lift, the wheels onto the ground between
; the rays plus the bump, rises at most LiftRate units a second (test 34: 60 units in a frame
; launched the bike; test 35, with the rise filtered over 0.12 s instead, still +34 in a
; quarter second at 900 units a second, "the bike jumped violently": 120 is 30 units over a
; quarter second); down it goes as it likes. LiftRate=0: unlimited. Read again on getting on.
LiftRate=120
BumpMax=30
BumpSettle=0.45
; A suspension (test 36's wish, the bumps no longer launching the bike but "still stiff,
; nothing like suspension": "the wheels would follow the ground and the frame and rider
; follow them through a spring and damper, compressing and rebounding over bumps").
; Suspension=1: each wheel sits on its own ray's hit, moved against the frame by what it
; lacks from where the frame holds it, pushed up into the frame over a bump by SuspTravel
; units at most (0 = the wheels fixed to the frame), dropped into a hole by SuspDroop (below)
; at most, and the frame's lift, the wheels' line, is followed through a spring of
; SuspFrequency hertz with the damping ratio SuspDamping (0.6: a step is met with a
; compression and a rebound of a tenth of it; 0.5, a rebound of a sixth, was "great, maybe
; a tad too soft" in test 37; 1: no rebound; the stiffer and the more damped, the nearer the
; plain filter) instead of the filter over 0.15 s. What a wheel's travel can't take of a
; bump (its deficit
; over SuspTravel) the bump lift above takes as before, and LiftRate still caps the frame's
; rise; the frame never sinks more than SuspDroop below the ground's contact, on the rebound
; of a drop or where the wheels' line runs below it (test 38: stopped on uneven ground both
; wheels hung at full droop with the frame held at the contact). The
; trace line carries the wheels' offsets ("susp F +3.2 R -0.4"). Suspension=0: the filter
; and the bump alone, exactly as before. The rear wheel rises into the frame by
; SuspCompressRear at most (its mudguard is on the frame, not on the swingarm: test 37 found
; the tyre within 10 units of it, the closest touching, so at +10 the tyre went into it), its
; drop SuspDroop like the front's; what the rear can't take of a bump the frame takes, as before. The
; front wheel's lower fork legs, mudguard and caliper (the shapes the mesh tool names
; "_fork") turn with the bars and ride with the front wheel's travel, so the axle stays in
; the fork ends and the mudguard over the tyre; both move along the steering axis (test 38:
; "forks were getting out of tubes": the move ran along the bike's z while the fork is raked
; 29 degrees, so at the full 10 the sliders sat 4.9 units off the stanchions' line). All read
; again on getting on.
Suspension=1
SuspFrequency=2.0
SuspDamping=0.6
SuspTravel=10
SuspCompressRear=4
; How far a wheel drops below the frame, at most, both wheels; the compression stays
; SuspTravel for the front and SuspCompressRear for the rear (test 38 found the sliders off
; the stanchions at -10: their overlap is 8 at rest, the stanchions' lowest vertices at z
; 58 to 62 inside sliders topping at 69.9, and the rear axle leaves the swingarm the same
; way; the front sat at full droop a tenth of the moving time). 4 keeps the look of travel.
; The frame may sink by this much under the ground's contact too, so the wheels reach the
; ground where the line between the rays' hits runs below it (a crest, a bump under the
; rider), and a landing's undershoot shows as the wheels compressing a few units.
SuspDroop=4
; How long a wheel takes to extend away from the frame (its offset falling: into a hole,
; off a step), in seconds; compression still takes 0.03 s, a bump mustn't put the tyre into
; the frame (test 38: "the look of it was a bit too much, like there was no weight behind
; it": each wheel followed its ray within 0.03 s both ways, the front was past half its
; travel 43% of the moving time and moved 10 and more within a quarter second in a fifth of
; the samples, full-travel flips in a twentieth).
SuspExtend=0.1
; A landing taken on the suspension (test 42: off a high ledge "it should sink on the
; suspension and carry on"; the frame stayed extended at the landing, F -3.0 R -3.0). At the
; first frame on the ground after LandAir (in [Steer]) or more in the air, the frame sinks by
; the fall's speed over its last three frames in the air: the front SuspTravel x the fall /
; LandSpeed (all of it at LandSpeed or faster), the rear SuspCompressRear at most, on the
; frame's own spring (SuspFrequency, SuspDamping) from a kick: the whole sink at +0.09 s, back
; through the line by +0.31 s, a tenth of it over at +0.40 s, settled by +0.55 s, rising back
; no faster than LiftRate. It goes on what is drawn (the bike, its parts, the rider, and the
; wheels, which come out compressed by it), never on the filtered lift, the track or the
; pitch's filter, so the bump and the droop's floor see the frame as it would be without it.
; Needs Suspension=1, the tilt on and the parts file's wheels; a fall under a twentieth of
; LandSpeed sinks nothing. The "landing:" line gives the sink at both wheels and the nose's
; dip, the trace "lift -3.9 (landing -5.8, nose -2.5)" while it lasts. LandSink=0: not sunk,
; as before test 43.
LandSink=1
; The fall's speed (units a second) at which the front takes its whole SuspTravel: 686, the
; plugin's own gravity over a second's fall, rounded (test 42's 1.0 s drop met the ground at
; about 950: 10 at the front, 4 at the rear; a 0.46 s hop at 300 to 370: 4 to 5).
LandSpeed=700
; The bike (and the rider, below) turn about a point this far above the bike's feet ...
PivotHeight=0
; ... and this far ahead of it, towards the bars. 0 and 0: the contact under the rider, so
; the wheels stay on the ground at any pitch (while the rider stayed level the pivot was the
; seat, 74 and 12, to keep the seat under her; the rider goes with the bike now, and about
; the seat the lower wheel went into the slope by 74 x sin(pitch)).
PivotForward=0
; 1 = the rider tilts with the bike (test 23: on a slope the bike pitched and the rider stayed
; level, the hands in the air). The plugin can't turn the skeleton (the animation writes it
; after the plugin runs), so it does what it does for the bike: every skinned shape of the
; player's 3D but the bike's (the body, the outfit, the head, the hair) gets its skin-to-bone
; transforms rewritten each frame so that the mesh lands where the tilt about the pivot would
; put it, through a copy of its bone data that its skin instance is pointed at while riding
; (the game's own is shared with every NPC wearing the same mesh, and is never written); plain
; shapes under the bones (a holstered weapon, the Pip-Boy) get the same through their own
; transform. All or nothing: a skinned shape whose bone data can't be held (test 24: a suit
; with a bone that has no vertices, now accepted) leaves the whole rider level for the ride,
; and the log's "rider:" lines say which shape, its bone and the check; they also list every
; shape held. A bone whose node can't be read, or whose world transform can't be inverted (a
; hidden bone scaled to 0), is simply left as it is, logged with its values; a cloth bone's
; (test 28: the backpack's purse), sheared rather than rigid, is carried along all the same.
; If the game gives a shape a new skin instance (a decal's) or points one back at its own bone
; data, the plugin notices within 0.1 s and holds it again; a decal the game clones from a
; held shape (its skin pointing at the plugin's copy) is held from that shape's own level data.
; 0 = the rider stays level.
Rider=1
; 1 = the rider's hands turn with the bars: the hand and finger bones go round the steering
; axis by the bar angle before the tilt (and round the grip into line with the forearm,
; WristRoll and HandPitch above), the upper arm and the forearm solved as a two-bone chain from the
; shoulder to the turned grip (or, with no chain found, the forearm bones by 0.55 of the
; turn). The riding clips keep the hands at the straight grips in every pose since test 29,
; so the plugin does all the steering of them. 0 = the hands stay at the straight grips.
RiderHands=1
; A bone with no node of its own in the rider's skeleton (test 34: the hands' fingers; test
; 41: the Hard Hat's Head_skin, HEAD's child at (0, 0, 0), which 71.5% of the hat is weighted
; to, the glasses and most vanilla headwear with it) is held through its own transform, and
; was placed by the hands alone: within 30 of a hand and beyond it a finger, behind it along
; the forearm the forearm's, anything else carried with the tilt alone. So Head_skin got the
; bike's tilt alone while HEAD took the upper body's lean (about 14 degrees) and the level
; head: "helmet is sitting in 'default' position being stretched forward with character
; tilt". Now a node-less bone within NodelessNear units of a node that has a part takes that
; node's part first (the nearest such node): Head_skin the head's, written as HEAD's own, so
; the hat moves in one piece; Neck_skin on the neck the upper body's (collars, scarves); a
; helper on a hand node the hand's. 2: the skin helpers sit on their node, and the nearest
; node-less bone the hands' rules are for, the wrist end of the forearm, sits 6 from the hand.
; Beyond it the hands' rules go on as before. The hold's "bones without a node" line counts
; those placed by the node they sit on. 0 = off, as before. Read again on getting on.
NodelessNear=2
; Test 25 lost about 30 fps with the rider held; test 26 found it was the plugin's memory
; safety checks (one VirtualQuery costs about 100 us on that PC, and there were 39 a frame),
; so since then nothing per frame asks Windows about memory: everything is checked once when
; held, and the cache of known memory regions is kept across frames (emptied on a load and
; when the 3D changes; each entry lapses on its own after 30 s and a stagger, so the
; re-check is spread over half a minute: test 37's flush of the whole cache every 30 s
; re-walked the rider in one go, a 12-16 ms stutter). Nothing is written while the bike is
; level either (under half a degree; tilted again over one). These four tell apart where
; any time still goes.
; They're read again every time you get on, so an A/B needs no restart: change them, get off,
; get on. RiderSkinned=0 leaves the skinned shapes (body, outfit, head, hair) alone;
; RiderPlain=0 the plain ones (holstered weapon, Pip-Boy); RiderSwap=0 writes the game's own
; bone data in place instead of pointing the skin at a copy (an experiment only: NPCs wearing
; the same mesh get the rider's tilt); RiderWrite=0 holds (and swaps) but never writes. The
; log's "time:" lines (with Trace=1) give the frame's cost in microseconds: the whole frame,
; the bike's part, the rider's, the skin sync (every 0.1 s) with its memory queries, and how
; many memory queries a frame in all (should read 0).
RiderSkinned=1
RiderPlain=1
RiderSwap=1
RiderWrite=1
; 1 = log the ground and the tilt every 0.25 s while riding (for matching a video to the log).
Trace=1
; The worn bike's shapes start with this name (CMB_BikeWorn, CMB_BikeWornRider, ...RiderF).
Shapes=CMB_BikeWorn
; How the game stores rotation matrices: auto (read off the bike's skin and the player's 3D),
; file or transposed. Only if the log says the two disagree.
Layout=auto
; The 2026-11-01a build (test 47's "floating" rider, pose.jpg: the plugin's 320 copies of the rider's bone data ran out at
; 19:55:00.981, held by the blood decals of two fights, and every ride after it stayed level, the arms out straight). Each
; key below is read again on getting on, and its 0 is the 2026-10-31a build's way.
; 1 = a decal follows its owner and is never held: a skinned shape of the rider whose skin is on a held shape's copy or
; data (with its bone count: the game's clone of that skin), or, named Decal, shares its data with another skin. The game
; keeps a decal on its owner's data itself; holding it cost a copy each and a line every sync, and bought nothing (all 414
; compares byte for byte the same). A decal is then not counted toward the rider's 160 shapes either. One line a ride per
; owner: "rider: 7 decal(s) follow FemaleVault111Suit:0 (...): not held". 0 = decals held like any shape.
DecalsFollow=1
; 1 = a copy is reused once no skin of the player's 3D points at it (the rider's walk each sync), whatever its reference
; count says; test 47's counts drifted with every re-point, so copies were never reused. 0 = once its count is back at the
; base.
ReuseByWalk=1
; 1 = when every copy is taken, the rider is level only until one comes free, the hold tried again every second ("rider:
; the copies are all taken (...): the rider level until one is free"). Each getting off logs the copies' census: "rider:
; the copies: N made of 320, N held, N still pointed at, N free". 0 = level for the rest of the ride.
PoolWait=1
; 1 = a skin the game left on one of our copies that no held shape owns (a shape it rebuilt from a held one, test 47:
; 19:50:16.8) is held from the game's own data that copy stood in for, and put back on it at the let-go, so the copy
; comes free. Each copy keeps a reference to that data till it's taken again. 0 = held from the copy as it is, which then
; stays its "original" for as long as the outfit is worn.
OrphanRestore=1
; 1 = every frame, a held skin the game pointed back at its own data is put on ours again before the rider is written
; (test 47: the suit was re-pointed at every sync in the fights, so between two syncs it may have drawn level while the
; hands and head tilted); the let-go's line counts "found so in N of M frames". 0 = at the 0.1 s sync only.
RepointEveryFrame=1
; The pose check: each frame from 1.0 s into a ride, the higher of the clips' knees (the skeleton's RLeg_Calf and
; LLeg_Calf, read whether or not the rider is held) is measured over the player's position. Seated it reads 60 to 68 in
; every riding clip; a standing clip's highest knee is 38 at the median, 55 at most. Under SeatKneeMin for 2 frames is off
; the seat, at or over it for 2 frames back on. With PoseCheck=1 the global CMB_RiderPoseOff carries the seconds the clips
; have been off the seat (0 while on it, and at a ride's start and end), and the controller applies the riding pose again
; once that passes its own CMB_PoseOffAfter (3 s: longer than a stagger or a hit's reaction). 0 = the global never
; written, so the script never acts on it. Without the global (an older ESP) one line says the check is off. The log's
; "rider: the clips off the seat ..." and "... back on the seat after N s" lines (the bike on COM; at most 6 pairs in 10
; s, then a summary; the ride's totals at getting off) come either way, as does one "rider: the clips' hands L/R from the
; grips" line a ride (a calibration line, nothing reads it).
PoseCheck=1
SeatKneeMin=52
; 2026-11-02a. Test 48 ("food made arm stretched during eating animation": an animation mod's use clip took the hand to
; the mouth while the plugin held it on the grip, and the skin stretched between them). When the script says an item was
; used (CMB_RiderItemUse), the plugin watches for its use clip for UseLetGo seconds: a hand of the clips more than
; UseHandOff from its grip (riding they read 9 to 22) or the knees off the seat. While it plays, the hands and the upper
; body's lean and twist are the clips' (the rider still tilts with the bike; a prop in the hand stays in it), eased out
; and back in over UseBlend seconds; it's over once the hands are back and the knees seated, or UseMax seconds after the
; item at the latest. With no use clip (no animation mod) nothing changes ("rider: no use clip within 4 s of the item").
; UseLetGo=0: the hands held through it, as in the 2026-11-01a build. UseBlend=0: let go and taken back at once. An ESP
; without CMB_RiderItemUse says so once and holds the hands as before. Read again on getting on.
UseLetGo=4.0
UseHandOff=30
UseBlend=0.3
UseMax=8.0
; Test 48: in first person (the Pip-Boy too) the third-person skeleton stands (the knees at 38 from the first frame to the
; last), so the knees aren't measured there and CMB_RiderPoseOff reads -1 ("first person"); the controller's footstep
; watch leaves first person's footsteps alone by it. One line a ride says so, and getting off "first person N time(s)
; this ride". 0 = measured in first person too, as the 2026-11-01a build. Read again on getting on.
PoseFirstPerson=1
