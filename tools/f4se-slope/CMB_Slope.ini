; again on getting on.
PoseViewSettle=0.1
UseRearm=1
UseBackTime=0.4
PoseOffRewrite=1

[Steer]
; 1 = while riding, the bike turns at most its speed / the turning radius, or "Turning when
; stopped" degrees a second when that is faster: no spinning round on the spot. The radius
; goes from the MCM's "Turning radius at walking pace" when slow to "Turning radius" (at
; riding speed, 0 = steering off) from FullSpeed units a second up.
Enabled=1
FullSpeed=900
; 1 = change the move keys before the game uses them (the game's MovementHandler is wrapped,
; the log says so), for the two below. 0 = leave them alone: back turns the bike round.
InputHook=1
; A side key alone from a stop (below CreepBelow units a second): the bike turns at "Turning
; when stopped" and creeps forward just fast enough to go round a circle of CreepRadius units
; (55: about 58 units a second at 60 deg/s). CreepInput is the first forward input tried for
; that (it's learnt while riding: rough ground takes more, and a surge once the bike is free
; of something is cut short). Creep=0: it turns on the spot instead.
Creep=1
CreepRadius=55
CreepInput=0.1
CreepBelow=100
; 1 = holding back backs the bike up, facing forward, at BackSpeed units a second; with a
; side key the rear goes that way (the nose the other), as a car reverses. The game's own
; movement only goes forward, so the plugin moves the bike itself: BackPush=auto makes small
; steps, each only after rays (the game's own picking, with the player's collision) find the
; way back clear for BackClearance units: nothing at knee height on either side of the bike or
; at chest height, ground under the rear wheel and just behind the rider (the steps follow
; it, the wheels kept on it). Triggers and other phantoms, and clutter, debris, bodies and
; water, are passed through; the rays for the ground pass through actors too, the knee and
; chest rays don't (Dogmeat behind stops the bike). A turn is only made if that way is clear too; if not, it backs
; up straight, and if that isn't clear either it stops (the log says what's in the way). Else
; back just brakes. The rays need F4SE's Address Library (version-1-11-240-0.bin in
; Data\F4SE\Plugins, "Address Library for F4SE Plugins"). off = back always brakes; ray,
; delta, mod, velocity or position = only that one (position: steps without rays, through
; walls).
Reverse=1
BackSpeed=80
BackPush=auto
; How far behind the rider the way back must be clear (the knee and chest rays end a step past
; it, the ground is looked for under it). 0 = the rear tyre's back edge from the parts file,
; |RearAxle y| + WheelRadius, 70 on this build, plus BackMargin; 150 = test 16's number for the
; vanilla bike, test 42's behaviour; 80 to 500 as set, anything else 0. Test 42 ("way too
; far"): at 150 the bike stopped with 56 free behind the tyre at a rail (20:55:53) and about 86
; on a 33 deg slope (20:59:43). Without a parts file 0 is 150, as before. The log's "reverse:
; the rear's clearance" line says which, once the parts file is read and at a push's start.
BackClearance=0
; Past the tyre's back edge (25: the step's 4 at most, the ray's end being the point judged,
; and a hand's width; nothing on the bike overhangs the tyre, the mesh's rearmost point is the
; tyre's at 70.3 behind the rider, the fender ends at 64.2). This build's clearance is then 95:
; the bike stops with 25 to 29 free behind the tyre. Never under 60 in all.
BackMargin=25
; 1 = with a parts file, each step a ray down where the rear tyre's back edge will be after it,
; from 60 over the slope 55 back's line there to 60 under it: the ground more than 20 below
; that line (the feet rule's 20), or none, and the bike stops with the tyre's edge a step short
; of the lip ("reverse: stopped: the ground drops away under the rear tyre", "no ground under
; the rear tyre"). With the clearance at 95, not 150, a ledge would be found by the feet rule
; alone, the tyre hanging 62 to 67 over it by then. On a slope the line follows the ground; a
; lip already between 55 back and the tyre's edge when the push starts reads as a slope to the
; ray 55 back, and the feet rule stops the bike as before. With Trace=1 the "rays" lines give
; the ground under the tyre. 0 = no such ray (test 42's behaviour exactly is BackClearance=150
; with BackLedge=0).
BackLedge=1
; Hung up (test 44: astride a wooden road barrier at 22:47:42 the ground just behind the feet was
; 28 to 32 under them, and every push back stopped "the ground drops away under the step" (more
; than 20 down) till the tester wriggled the bike off; on a grill at 22:54:03, 32): both wheels'
; rays finding the ground over 10 under the feet, or forward stalled at a face at the capsule, in
; the last 3 s and within 40 of there (the stalled kind is the climb's rays': Climb=1). Then a
; drop of up to BackHungDrop under the step is backed off ("reverse: hung up (...): the ground 30
; under the step backed off onto", a second apart at most); more, or none within 20 under that,
; is still a drop, a stop that now says so ("... drops away under the step, N units back (50 down,
; over BackHungDrop's 40 though hung up)", "(none within 60 under the feet, hung up)"). The rear
; tyre's ray (BackLedge) is as before. 20 to 80 (between 0 and 20 is read as 20), on a "  reverse:"
; line of its own; 0 = 20 hung up or not (test 44's build).
BackHungDrop=40
; Experiments for the controller saying "in the air" while the bike backs down a slope with
; its wheels on the ground (tests 18, 19): a gap under the feet at the step is closed only
; while the controller doesn't hold itself supported (its supported bit clear, or its state
; not on the ground), the feet going down to 0.5 over the ground, 3 a frame at most (that is
; with BackFollow=0; with it on, only down to the controller's own clearance, below); with the
; controller supported the gap is its own hover (test 39, a level road: every one of 15 gaps
; of 0.4 to 2.4 closed onto the ground with the controller supported was followed by it in
; the air within 0.75 s, the player dropping 20 to 37 through the road and climbing back over
; 0.8 s). BackSink is how far below that hover the feet go (0 = to it; test 18's 1.5 into the
; ground lost the support more often); BackSupportCheck=1 calls the controller's
; CheckSupportImpl after each step. The log's "rays:" lines show the gap, the step's dz and
; the controller's support fields either way.
BackSink=0
BackSupportCheck=0
; Test 40: "backing up makes the camera shake a bit", downhill only (the whole picture shook
; while the bike stayed put on screen, the background jumping about 5 px at 1080p at -80 a
; second, the bike's applied pitch smooth). The step took the slope 55 back while the
; controller held itself supported (on brows 4 to 19 units ahead of the ground under the feet,
; and each run flipped into the air right after such a stretch), and once it said it was in the
; air, "close the gap to the hover", mostly 0 (in 47 of 69 such lines): the game's gravity then
; carried the bike down in small hops. Now, going back level or down, each step follows the
; ground's slope over BackFollow units centred on the step's middle (two more rays down there),
; the controller supported or not, and unsupported a gap is closed only down to the
; controller's own clearance (the gap it kept while supported, 0.5 at least, less BackSink),
; over BackClose seconds, at most 120 a second and 3 a step: at test 40's flips into the air
