; unit is 1.43 cm); 1.75 puts it at about 50 on the dial (0 to 80), which is how fast the ride looks
; and sounds; 1 = the true speed.
Scale=1.75
; The needle follows the speed over this many seconds (0 = at once; the speed itself is measured
; over 0.2 s).
Tau=0.3
; 1 = the dial's backlight lit with the headlamp (the MCM's Headlamp, its hotkey), 0 = never lit
; (27c's dial). The needle's own paint glows faintly all the time, lamp or not (its material's glow
; map, the blade only, so it reads at night); it goes with the needle at Needle=0.
Backlight=1

[Tail]
