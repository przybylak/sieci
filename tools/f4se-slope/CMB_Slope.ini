; obstacles. At c = Caution/100, FaceLook above times c, WallStopPersist times c, WallStop divided by 0.5 + 0.5c (the keys
; keep their meaning at 100 %), and with c under 1 the need taken from the 0.05 s speed. -1 = the MCM's "Caution"
