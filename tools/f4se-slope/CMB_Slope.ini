; gates the game refills the player's AP through: the actor state's sprinting bit, PlayerCamera
; +0x1A5 (the scope's hold-breath), the process's AP regen delay and its CachedValues' bit 22 (set
; while AP is under its max), with the AP modifiers ("AP watch (12.0 s after getting off): ...
; refill gates shut: ..."): every APWatchEvery seconds for APWatchFor seconds after each getting
; off, and past that whenever one of them changes. Only read, never written. The controller
; script logs AP, its rate and the rate's mult beside it ("[CMB] AP: ..." in the Papyrus log).
; The gates' places are test 45's tester's disassembly of 1.11.240, and since test 47 the build-27b
; check's for the two test 46's build took from CommonLibF4's headers: the regen delay is AP's,
; [[Actor+0x300]+0x10]+0x68, logged with its raw bits, so a wrong place shows (the game's
; GetRegenDelay maps AP to +0x68 and Stamina to +0x64, which test 46's build read: its gate (c)
; showed Stamina's delay, most likely always 0, and could never read shut), and the modifiers at
; Actor+0x450, where the game reads AP's. The offset has no key: a plain fix. Test 46's AP stayed at
; 0 for its last 5 minutes with every gate open, all of it after the console's "tai" at 7:47 (AI
; processing off, never turned on again), which alone stops every refill and every timed effect:
; the game's process lists return at once and the actors' clock stands still. So test 46 says
; nothing of AP; test 45's checks came after its knock-overs, likely with AI off too. A watch
; starts at each getting off in the session (not at a load on foot). 0 = no watch, as before test
; 46. Read again on each getting off.
APWatch=1
