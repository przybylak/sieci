; Back brakes only once forward is let go (the game's move vector carries one y); this key brakes
; with forward still held. While rolling it brakes as back does (the throttle off over Brake
; seconds, the brake light, the engine braking down through its gears); once stopped it holds
; the bike still while held (no reverse, no creep; back still backs up once it is let go), and
; forward held through it waits and pulls away from a tenth when it is let go. -1 = the MCM's
; "Brake key" (Hotkeys; CMB_BrakeKey, 57 in a new save, 57 also with an ESP without it), read at
; each ride's start; or a DirectInput scan code, the codes the built-in hotkey slider takes (57
; Space, 42 Left Shift, 29 Left Ctrl, 45 X; 256-260 the mouse buttons; the numpad's digits, 71-83,
; brake with NumLock on); W, A, S and D (17, 30, 31, 32) are refused. Only while riding, only with
; the game in the foreground: off the bike Space jumps as always (the jump is off for the ride).
; The log says the key on getting on ("steer:
; BrakeKey=-1: the MCM's CMB_BrakeKey 57, Space (VK 0x20): brakes as back does ...") and at its
; first press on a ride ("steer: the brake key (Space) held at 903 u/s: braking").
; BrakeKey=0 (or the MCM's at 0): no brake key, only back brakes, as in the 2026-10-31a build.
BrakeKey=-1
; The throttle never runs more than Lead (of the top) ahead of the bike's measured speed
; (test 23: from a stop the game's speed lagged it for a second and then surged to catch up;
; stuck on a hillside with W held it sat at 0.8 and would have lunged once free). 0 = off.
Lead=0.2
; 2026-11-06a. Test 49: an item used at speed braked the bike: the item animation mod's use clip took the locomotion for
; half a second (773 -> 189 a second; the game's graph moves the capsule by the clip's own root motion) and the Lead cap
; followed the speed down, so the bike took 1.4-1.9 s more to be back at speed. UseBlockAbove: while riding at this
; speed (units a second) or more, the graph event the use clip is asked with (UseBlockEvents, up to 4 names,
; comma-separated; every idle of the item animation mod sends dyn_ActivationAllowMovement) is refused: no item animation
; while moving, no speed lost; the item itself and its effect are the game's as always. Under it (stopped, walking pace)
; the clip plays. One line an item ("rider: the graph's dyn_ActivationAllowMovement at 773 u/s (an item's use clip):
; refused, the speed kept ..."). 0 = passed at any speed, the 2026-11-02a build. UseHold: a standing clip the block
; doesn't catch (another event, a hit's reaction) at UseHoldFrom or more with forward held leaves the Lead cap off for up
; to this long (s), so the throttle is where the clip found it when the clip is over ("throttle: held at ... (UseHold)");
; ended early by the back or brake key, forward let go or a face ahead. 0 = the cap through clips, the 2026-11-02a build.
; Read again on getting on.
UseBlockAbove=150
UseBlockEvents=dyn_ActivationAllowMovement
UseHold=2.0
UseHoldFrom=200
; 2026-11-09a (test 50: the use block never fired: the item animation mod's idle never reaches the graph's slot 1, and
; the script hears of a hotkey use up to 1.3 s after its clip began). UseListen (s, 0-10): for this long after an item
; cue (an item used, the props attached, the knees off the seat) every event name through slot 1 is noted, and one line
