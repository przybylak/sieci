; 4th (19:41:23.609 "gear 1 at 145 u/s, 1738 rpm, heard 145 u/s (clutch in)"): with the throttle
; shut the heard speed fell only CoastFall rpm a second in its gear, 70 u/s^2 in 4th (BrakeFall
; 140), where the game's bike loses 450 coasting and 2250 braking, so it never got through
; CoastDown's bands before the bike stopped. With StopShift=1, once the throttle has been shut
; StopAfter seconds (braking at once) the heard speed falls toward a slower bike at least
; HeardStop u/s^2 (HeardBrake braking): 300 is about 4.3 m/s^2 (the game's coast, 6.4, is a firm
; real stop), 600 about 8.6. The gears then come down one at a time, each with CoastDown's blip
; (paris's: 0.3 s), at least StopGap seconds apart (the blip plus a pull of the lever: a judgement,
; the rides' down-shift spacing isn't among the numbers kept), and the clutch waits up to StopHold
; seconds after the bike's own ClutchSpeed for the heard speed or the last blip (a blip that would
; end later isn't started). The harness's game: let go at the cruise, blips 4->3, 3->2 and 2->1 at
; +0.60, +1.06 and +1.53 s (1730, 1812 and 1835 rpm), then the clutch at +1.83 (2134 rpm, the
; bike at 165: "gear 1 ... (clutch in)"); braking from the cruise, two blips (+0.22, +0.62), the
; clutch from 2nd at +0.98, up to 0.4 s after the bike's own stop; a 0.5 s let-off sounds as
; before. The keys are read 0.1 s past their last read, so a tap of the brake over about 0.08 s at
; the cruise blips 4->3 and changes up again a moment later (HeardBrake lower makes it rarer).
; StopShift=0: the 2026-10-31a build's stops (a gear, then the clutch); with it on, CoastFall and
; BrakeFall matter only before StopAfter and below HeardStop.
; StopShift needs HeardSpeed=1 (with 0 it does nothing). StopHold=0 puts the clutch back at the
; bike's 150, with whatever blips fit before it; StopAfter=0.6 leaves all but the longest let-offs
; as before (session 1: 9 let-offs of 0.76 to 1.78 s in 21 minutes).
StopShift=1
HeardStop=300
HeardBrake=600
StopGap=0.4
StopHold=0.4
StopAfter=0.3
; The pull-away: the clutch slips from LaunchDraw's start, drawn afresh for each pull (each
; press of the forward key) between its two values (paris 1250 to 1500, median 1380; "0,0":
; IdleRpm + Launch x the key, 1500, as up to test 44), climbing LaunchRise rpm a second while the
; heard speed rises at HeardRise (paris 370, IQR 250 to 540; 0: a flat slip, as up to test 44: 1.5
; to 2 s at 1500, then a sprint) until 1st gear's rpm takes over. Each pull also draws its
; full-throttle up-shift point from ShiftDraw (paris's first shifts 2000 to 2900, median 2370;
; "0,0": ShiftRpm, every pull-away alike, as up to test 44). The draws come from WanderSeed's
; numbers, in a stream of their own that each set starts afresh: every ride's first pull shifts at
; 2634 (2429 with 2000,2900) from a slip of 1293. The 2026-11-01a build (test 47: "rpm could be
; slightly higher the closer it is to shifting gear"; its 1->2 at a median 2355 rpm, 2->3 2347):
; 2300,3000, so 1st and 2nd change up at a median of about 2600 (p10-p90 2356-2929, at most about
; 2950), +250; 3rd still changes up at about 2340, all 3rd has at the bike's top speed, after a
; moment there, and the pull to 4th takes about 0.7 s longer. A/Bs: 2300,2900 (a median 2558),
; 2400,3100 (2707); 2000,2900: the 2026-10-31a build's.
LaunchDraw=1250,1500
LaunchRise=350
; The 2026-11-06a build (test 49: "I just want take off to be faster"; a launch's first 0.5 to
; 0.75 s sat at the IdleDb floor, heard only as a pitch rise): a launch rev. A press of forward in
; 1st with the bike under ClutchSpeed, in a launch, revs the slip LaunchFlare over itself (0 to 2),
; the share fading out as a cosine over LaunchFlareTime seconds (0.05 to 5): by engine_model.py in
; the harness's game 1938 rpm and -1.1 dB at +0.5 s where the 2026-11-02a build had 1432 and -5.2,
; into the slip's own climb by 1.2 s. Only 1st's rpm moves: the gear decisions, the heard speed and
; every shift as before. LaunchFlare=0: no rev, the 2026-11-02a build's; 0.3 milder, 0.6 punchier.
; Read again on getting on.
LaunchFlare=0.5
LaunchFlareTime=1.2
ShiftDraw=2300,3000
; The loop table, family:base rpm (the rpm the file was made at), one entry per loop in the order
; of the ESP's CMB_SndLoop globals and the controller's plays, so the order is fixed: the idle
; (CMB_EngineIdleLP.wav), on load 1400, 1700, 2000 (the cruise loop, which the crossfade plays
; too), 2400, 2800 and 3300 (CMB_EngineOn<base>LP.wav), the throttle shut 1400, 1800, 2300 and
; 2800 (CMB_EngineOff<base>LP.wav), all made by tools/sound from demodave's recording (Freesound
; 502690, CC0). The family is idle, on, off or on+off (one loop in both families, one voice), 11
; entries at most; a base must be its file's, or that loop plays off pitch. A shorter table
; drives its first entries and silences the rest ("N past the Loops table silenced").
Loops=idle:860,on:1400,on:1700,on:2000,on:2400,on:2800,on:3300,off:1400,off:1800,off:2300,off:2800
[Fx]
; The bike's own sounds besides the engine (the 2026-11-01a build; test 47's wish: "sound when
; jumping off of a ledge or anything else, currently the sound used is default character jump
; effect, another sound would be when bike is crossing a water"). The controller plays the game's
; own sound files (docs/ASSETS.md "Borrowed from the game"): a tyre thump at a landing, louder the
; higher the drop, a metal clunk on top of the big ones, a splash into water, and a water loop
; while riding through water. Since the 2026-11-02a build (test 48: played, and not heard: the
; game's records carry 4.9 to 17.2 dB of their own attenuation and fade with the riding camera's
; distance) it plays them under sound records of our own over the same files by path, with no
; attenuation of their own and full level out to 600, like the engine's. This plugin tells the
; script when and how loud, through the CMB_Fx globals; the MCM's Sound section has "Bike effects
; volume" (90), "Bike sounds through the mod's own records" (on; off: the game's own records, the
; 2026-11-01a build), "Landing loudness range (dB)" (10, the softest landing that far under the
; hardest, which the "fx: landing cue" lines quote; 18 the 2026-11-01a build) and the "Landing
; sound", "Water sound" and "Mute the rider's own jump and landing sounds" switches. Read at the
; start and again on getting on.
;
; The landing cue: a flight is AirMin seconds or more in the air (CMB_FxAir 1, its number in
; CMB_FxLandSeq); at its landing the level by the fall's speed (CMB_FxLandLevel, 0 under LandFrom
; units a second, 1 at LandFull; 2 more into water deeper than 2) and CMB_FxAir 2 for AirHold
; seconds, so the landing clip's first event plays the sound. Test 47's landings would have read
; 0.82 (the 4 m drop, a fall of 334: heavy tyre and clunk), 0.47-0.48 (208-213: heavy), 0.24-0.29
; (125-143: light) and 0.07 (66-69: light, 17 dB under the top). The "fx: landing cue" lines give
; each one, "fx: the script played cue N's landing sound 0.031 s after the landing" the delay.
; Land=0: no cue (CMB_FxLandLevel -1 from the ride's start): the script's own fixed level on the
; landings whose clips send JumpDown; the 2026-10-31a build has no landing sound.
Land=1
LandFrom=40
LandFull=400
; Seconds in the air for a flight (past the 0.25 s the run clip takes to blend out at a fall, whose
; sync markers must not read as a landing), and how long CMB_FxAir stays 2 after its landing.
AirMin=0.35
AirHold=0.3
; The water loop: the script plays it at no volume on getting on and hands its id over
; (CMB_FxWaterId); the plugin drives it (CMB_FxDriven its id: "fx: the water loop (id N) driven")
; by the water over the feet and the speed: sqrt(depth / WaterFull) x (WaterStill + (1 -
; WaterStill) x speed / WaterSpeedFull), each at most 1, x the bike effects volume; rising over
; WaterRise seconds and falling over WaterFall (to a tenth in 0.9 s), the pitch from WaterPitch's
; first at a standstill to its second at WaterSpeedFull (1 at most). At FxVolume 90: 20 deep at
; 600 a second 0.64, at 300 0.37, standing 0.10; 5 deep at 600 0.32. Entering the water after half
; a second dry at WaterSplashSpeed or faster adds a splash, WaterSplash dB over it decaying over
; WaterSplashTime (0: none). Water=0: the loop declined ("declined (Water=0)"), silent: the
; 2026-10-31a build has no water sound.
Water=1
; Where the water's surface is read: loaded (the player's loaded data: its water type and height,
; in water when that is a TESWaterForm and the height half a unit over the feet) or controller
; (the character controller's water height). Each "fx: into the water" line gives both, and the
; swim height, and "fx: the water readings at the ride's start" the dry ones: send them.
WaterSource=loaded
WaterFull=40
WaterSpeedFull=900
WaterStill=0.15
WaterPitch=0.85,1.0
WaterRise=0.08
WaterFall=0.4
WaterSplash=6
WaterSplashTime=0.35
WaterSplashSpeed=300
; The 2026-11-02a build (test 48: the water loop driven 23.7 s in water and not heard: the game's
; record carried 9.7 dB of its own attenuation and its output model faded it to about 38 % at the
; riding camera's 450; MCM "Bike sounds through the mod's own records" now plays our own record
; over the same files, as loud as these numbers say): WaterGain dB on the loop's level (-40 to
; 12), read again on getting on. 0 = the 2026-11-01a build's levels; -6 half as loud.
WaterGain=0
; The 2026-11-06a build (test 49: "driving through water sounded more like frying or crumpling
; foil"; in the pond the bike was at 750 u/s or more 85 % of the time, where the old law was flat):
; the speed's share (speed / WaterSpeedFull)^WaterCurve (1 to 4), WaterSpeedFull 900 (600 before)
; and WaterCurve 2 (1): -2.6 dB at 750, -8.8 at 450, -12.3 at 300, full at the top speed.
; WaterSpeedFull=600 with WaterCurve=1: the 2026-11-02a build's law. The MCM's "Water sound loop"
; picks the loop (read on getting on): 0 the 2026-11-02a build's spray, 1 the game's churn, 2 the
; mod's own wet road (the 2026-11-08a build's default), 3 the gentle wet road (since 2026-11-09a, the
; default: test 50 heard the wet road as static; the same recording with less hiss and more body,
