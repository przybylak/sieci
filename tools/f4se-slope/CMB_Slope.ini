; and the use watch took it for the item's use clip, ended it as the hands came back, and held the hands through the
; real eating clip that came 0.6 s later. PoseViewSettle: for this long (s) after first person ends the knees and the
; clips' hands aren't measured (CMB_RiderPoseOff stays -1; one line a ride). UseRearm: after a use clip ends, a second
; one starting within this long (s; and within UseLetGo of the item) is taken too ("the use clip began again ...
