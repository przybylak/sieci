; red) lit all the time you ride; 0 = the plain lens, as 27c's.
Glow=1
; The brake light (a shell over the tail lens and both rear signals, red, about three times the
; running light's brightness) lit while braking: with the input hook, the back key while going
; forward faster than 10 units a second (the engine's sound reads braking the same way); without it,
