; An up-shift is a clutch gap of ShiftTime seconds (paris's gap 0.30, the daily ride's fall 0.39):
; the rpm flares by Flare for FlareTime seconds (time constant FlareTau; the daily ride's median
; +2.9%, the rides' +5%), then falls to the new gear's with time constant ShiftFall (the model's
; peak to engaged 0.37 to 0.42 s at a steady speed, the daily ride's 0.39); the engine's load is
; cut for the gap. Otherwise the rpm follows its gear with time constants
; RpmUp and RpmDown (idle to the slip in 0.1 to 0.2 s), rising RiseRate in log rpm a second at
; most (4.5% a frame at 60 fps: the game sets the pitch once a frame, and leaving idle stepped
; 187 cents in one; pulls and the flare never reach it). The rider's load = CruiseLoad + the
; smoothed acceleration / FullAccel (full from 220 units a second per second; the game's 300 is
; full throttle; with the heard speed, by HeardPull below), followed over LoadRise and LoadFall
; seconds.
ShiftTime=0.35
FlareTime=0.08
Flare=0.05
FlareTau=0.04
ShiftFall=0.1
RpmUp=0.1
RpmDown=0.22
RiseRate=2.64
LoadRise=0.08
LoadFall=0.15
CruiseLoad=0.45
FullAccel=400
; The throttle shut (forward let go, or back while moving forward): the rpm dips by LashDip (the
; driveline's lash, time constant LashTau; the daily ride's roll-offs dip 2.4 to 5.9%), then
; falls CoastFall rpm a second at most (BrakeFall braking; the game's coast, 900 to 0 in 2 s, is
; far harder than a real roll-off: paris -150, IQR -220 to -110, for 4 to 9 s; 70 up to test 44).
; With HeardSpeed=0 it never rises, the gear following the speed down silently; with the heard
; speed (below) the rpm falls in gear at that rate till the bike is nearly stopped.
LashDip=0.032
LashTau=0.15
CoastFall=150
BrakeFall=300
; The loops: the idle, and two families, on load and the throttle shut, one loop playing in each
; but for a hand-over (loops of one engine at one rpm interfere, phasing about once a second: one
; at a time, not a blend; the second demo's "fluctuation"). The idle fades out between IdleRpm +
; IdleFade's two (1010 to 1190 rpm, equal power) and the families in. A family's loop is the one
; whose stretch holds the rpm, the boundary between two neighbours OnSplit (OffSplit) of the way
; from the lower base to the upper in log rpm (0.5: the geometric mean), changed only Hyst (log
; rpm) past it, over XfadeTime seconds (the least cancellation of 0.017 to 0.1). Pitch = rpm /
; the loop's base, within MinPitch and MaxPitch (the bases keep it at 0.85 to 1.17) but for the
; idle and the lowest loops inside the idle's band. Should SetFrequency refuse a ratio over 1 and
; take one under it, "sound: pitch over 1 refused: the loops pitched down only (...)" once, and 1
; is the most for the session.
IdleFade=150,330
MinPitch=0.75
MaxPitch=1.25
OnSplit=0.5
OffSplit=0.5
Hyst=0.02
XfadeTime=0.05
; The family: on load once the rider's load passes OnAbove (in 1st gear the key itself: a launch
; plays the on-load loops from the press), the throttle-shut family once the key's demand has
; stayed under OffBelow for OffHold seconds (the daily ride's roll-offs change their timbre with
; the throttle, half the change 0.07 s before the rpm's dip), crossfaded over FamilyTime seconds.
; ShiftFamily=1: the throttle-shut family plays through each up-shift's gap (the rides' shifts
; are 28 to 35% darker; with 0 the shift darkened 16%, late, at 0.58 s); 0: the family follows
; the rider.
OnAbove=0.3
OffBelow=0.15
OffHold=0.05
FamilyTime=0.08
ShiftFamily=1
; The family loops' pitch wanders slowly at random, x (1 + w), w of standard deviation Wander
; (0 to 0.2) with a time constant of WanderTau seconds (the daily ride's cruise wanders 0.48 to
; 0.69%; these give 0.45% measured the same way; without it the cruise was dead flat), drawn
; from WanderSeed (the numbers engine_model.py draws; each set starts from it afresh). The
; gearbox never sees it. Wander=0: a steady pitch, and at a steady cruise hardly a call.
Wander=0.006
WanderTau=0.8
WanderSeed=12345
; The level, in dB under full load at LevelRpm: LevelScale x the larger of IdleDb and RpmDb x
; log2(rpm / LevelRpm) + LoadDb x (the rider's load - 1). The paris ride's law (its level wasn't
; compressed: 9.6 dB an rpm doubling, on load 5 dB over the throttle shut, the idle 17.2 under);
; LevelScale 0.7 (test 45; 0.3 up to test 44, what the daily and autumn cameras give, 0.29 to 0.36
; of it, the game's states within 2.6 dB by the tester's measure): the idle 12.0 dB under full
; load at 3000, a pull 8 dB over the idle (paris 11.6), the throttle closing from a pull 3.5 dB
; plus the lash (paris -4 to -5), from a steady key 1.9. The whole engine is quieter than up to
; test 44 (cruise -6.2 dB where it was -2.6, the idle -12.0 where it was -5.2: the MCM's engine
; volume makes it up). LevelRpm is the law's own reference, not ShiftRpm (the shift point
; moved to 2500 would have made all riding 0.76 dB louder against the idle). Sent as FadeTo's
; attenuation, -2000 x log10 of the gain (the idle at rest 1204), taken as hundredths of a dB (0
; full, 10000 -100 dB: an assumption the "driven" line repeats, which test 44 tells); the MCM's
; engine volume (CMB_EngineVolume, the controller's Sound.SetInstanceVolume) is taken to scale it.
LevelScale=0.7
RpmDb=9.6
LoadDb=5
IdleDb=-17.2
LevelRpm=3000
; The heard speed (test 45; the third "  sound:" line gives these). The game's bike does
; everything 2 to 3 times faster than the reference rides (900 in 3 s from a stop, stopped 2 s
; after a let-up), and the gears tied to its speed swept 1st and 2nd in 2 s and fell to idle as it
; stopped ("not natural whatsoever"). HeardSpeed=1: the engine follows a heard speed instead (the
; bike's motion is untouched): with the throttle on it rises at most HeardRise units a second per
; second toward the bike's speed (in 1st toward it + HeardLead: the clutch slipping before the
; wheels go, so the launch climbs from the press while the game's bike creeps; 140, not 150: at
; 150 2nd climbed 519 rpm a second, past paris's 200 to 500), and follows a slower bike with the
; time constant HeardTau (a 10% dip moves the rpm a few per cent); the rider's load is full while
; the bike is HeardPull or more ahead of it and the cruise load once it has caught up. With the
; throttle shut it falls CoastFall (BrakeFall) rpm a second in the gear (never under the bike's
; speed); under CoastDown rpm a down-shift with a throttle blip (the rpm Blip over the new gear's
; for BlipTime seconds, time constant BlipTau, on load: paris +27% in 0.3 s, +5 dB; Blip=0: no
; overshoot; CoastDown=0: the gear held to the clutch); the clutch goes in once the bike itself is
; under ClutchSpeed (or 1st's heard rpm under ClutchIn), the heard speed then the bike's. The
; throttle on with the bike under ClutchSpeed: 1st. Test 44's ride replayed through both (its
; speed and keys every 0.25 s): the first shift 2.19 s after the key at 2374 rpm, every pull alike
; (this model: a median 2.78 s, 2112 to 2889 rpm, the next 1.4 s later, the last about 6 s after
; the key; paris 2.6 s, 2370), 2nd climbing 875 rpm a second (486; paris 200 to 500), 36
; down-shifts with the key held at speed (2), the fall after a let-up -87 rpm a second (-146;
; paris -150), the clutch at 1825 rpm (1750, four blips on the way; paris about 1970).
; HeardSpeed=0: the bike's own speed, as up to test 44, and HeardTau, HeardLead, HeardPull,
; ClutchSpeed, CoastDown and the blip's three do nothing (HeardRise still sets LaunchRise's climb);
; with the other keys at the values the comments give as test 44's, test 44's model exactly.
HeardSpeed=1
HeardRise=140
HeardTau=0.8
HeardLead=150
HeardPull=60
ClutchSpeed=150
CoastDown=1700
Blip=0.09
BlipTime=0.3
BlipTau=0.05
