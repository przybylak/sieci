; Commonwealth Motorbike - steeper slopes while riding (CMB_Slope.dll, F4SE plugin).
; How steep is set in the MCM menu (Steepest slope while riding) or with
; "set CMB_MaxSlope to 60" in the console; 0 turns it off.

[Slope]
; Where the Havok character proxy keeps its slope limit, as a byte offset, and in what unit
; (cosine, radians or degrees).
; Not known yet: leave it empty and the plugin only reads and logs what it finds to
; Documents\My Games\Fallout4\F4SE\CMB_Slope.log. Send that log to get the value.
ProxySlopeOffset=
ProxySlopeUnit=cosine

; 1 = write the layout of the player's character controller and proxy to the log.
Probe=1

; How often to check, in milliseconds.
IntervalMs=100
