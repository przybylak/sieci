[Sound]
; The engine sound (test 44's build). The controller plays the engine's loops on the player, one
; Sound.Play each, in the order of Loops (below), and hands their instance ids over through the
; ESP's CMB_Snd globals: CMB_SndLoop01 to CMB_SndLoop11, then CMB_SndGen counted up, last (a new
; set). The plugin answers in CMB_SndDriven within a frame or two: the set's number when it
; drives it (every frame each loop's pitch, through the game's BSSoundHandle::SetFrequency, and
; its level, since test 46 through SetVolume with the MCM's engine volume in it (SetVolume below;
; up to test 45 FadeTo), from the engine model below, fed with the bike's speed along the
; heading, the forward and back keys and, since test 45, whether this plugin holds the throttle
; for something ahead: DownHeld), minus it when it declines ("sound: generation N declined
; (why)"), 0 when it has let go (the ids gone to 0: the controller's StopEngineLoops at every
; ride's end; the "let go" line sums the drive up: SetFrequency, FadeTo and SetVolume only post
; their change to the audio thread, which test 44's and 45's testers found by disassembling them,
; so since test 45 the line counts no failures, "(SetFrequency N, FadeTo N, SetVolume N: each
; posts its change to the audio thread)"; one returning false would still be named, ", N returned
; false" in there). A load lets
; go too, but CMB_SndDriven keeps the loaded save's value: the save's own set (its ids from before
; the save) is then "already answered" and left alone, and the controller's next set is taken.
; The riding globals aren't asked (with the MCM's three sliders at 0, CMB_SlopeLive,
; CMB_CameraLive and CMB_TiltLive are all 0 on the bike): the controller offers a set only while
; riding and withdraws it at every ride's end. Declined, or not answered in half a second, the
; controller crossfades its idle and cruise loops by speed once a tick, as up to test 43. An ESP
; without the thirteen globals ("sound: not all of CMB_SndLoop01 to CMB_SndDriven are there") has
; no set to offer. Every key here is read again on getting on (one of those three over 0: the
; plugin's ride start; the "  sound:" lines then end "(read again on getting on)"), so an A/B
; needs no restart: change them, get off, get on; the next set uses them. A value out of its
; range is its default, as in the other sections; a Gears, IdleFade, Loops, LaunchDraw or
; ShiftDraw line that can't be read is too, and the first "  sound:" line names it ("not
; understood, the defaults used: ...").
; Drive: 1 = take the loops the controller hands over. 0 = never: each set declined at once
; ("[Sound] Drive=0"), the controller stops the nine loops it added (playing at volume 0 till its
; first look at the answer, 0.05 s) and crossfades its idle and cruise loops, as before test 44
; (the controller's own switch, PluginDrivesSound, set false and the script compiled again,
; doesn't play the nine at all: test 43's two loops exactly).
Drive=1
; The Address Library (F4SE's version-1-11-240-0.bin, "Address Library for F4SE Plugins", the
; file the rays use), where the three sound functions are looked up by CommonLibF4's IDs
; (BSSoundHandle::SetFrequency 2267059, FadeTo 2267074, IsPlaying 2267046). Empty = next to this
; plugin, then the game's Data\F4SE\Plugins (with Mod Organizer the plugin's folder is its
; mod's); else its path. Read at the first hand-over (no cost when riding never starts), again
; only when this key changes or the last read found no file. Trusted only when its size is 8 +
; 16 x its count, six IDs give the RVAs this plugin has (PlayerCamera, TESDataHandler,
; PlayerControls, INISettingCollection and INIPrefSettingCollection from F4SE's own source: a
; library of another game version fails here; since test 46 BSSoundHandle::SetVolume, ID 2267057,
; at +0x162E160, where test 45's tester found it by disassembling the game: without it no volume
; can be put on the loops, which the controller no longer sets) and the three functions lie in
; the game's code (an executable section by its PE headers); else one line why ("sound: no
; Address Library at ...", "... is not the expected format ...", "... doesn't match this game (ID
; N gives 0x... where the plugin has 0x...)", "... isn't in the game's code ...") and the
; controller's crossfade. Found, the line "sound: the Address Library at ... matches this game
; ...; BSSoundHandle::SetFrequency +0x..., FadeTo +0x..., IsPlaying +0x..., in .text; SetVolume
; +0x162E160". SetVolume's RVA is the disassembly's, not yet read from a real library (the
; tester's log has SetFrequency, 2267059, at +0x162E220 and IsPlaying, 2267046, at +0x162DE60:
; 0x162E160 lies between them, as its ID does), and it is checked whatever SetVolume below says
; (SetVolume=0 puts the engine volume on by it too): a library that has it elsewhere is "...
; doesn't match this game (ID 2267057 gives 0x... where the plugin has 0x0162E160,
; BSSoundHandle::SetVolume)", then "sound: generation N declined (the Address Library at ...
; hasn't BSSoundHandle::SetVolume where the plugin has it)", and the crossfade.
Library=
; Test 46 (the tester: "engine still cuts off when changing a gear"; test 45's tester, by
; disassembling the game: FadeTo runs every fade over 100 ms at least, a straight line in
; hundredths of a dB from where it finds the loop, so a loop brought back from 10000 (-100 dB)
; stays under -40 dB for most of it: a hole at every family switch, two at each up-shift with
; ShiftFamily=1, and one at each hand-over, -30 to -39 dB for 60 to 80 ms; and every level change
; lagged 100 ms). SetVolume=1: each loop's level is set by BSSoundHandle::SetVolume, the value the
; controller's Sound.SetInstanceVolume sets, which the game applies at once with no ramp whenever
; it moved by 0.001 or more (clamped to 0.00001 to 1): every frame each loop's gain x the MCM's
; engine volume (CMB_EngineVolume / 100, read every frame, so a change is heard at once; the MCM's
; default 90 since test 47, where test 46's tester settled, 70 before, a save keeping its own;
; 90 too without the global), sent
; when it moved by 0.001 or more; a loop under 0.001 is silent (the game's message carries
; thousandths: 0), SetVolume(0) once and no pitch while silent. FadeTo isn't used (each set's
; loops are played afresh, no attenuation on them), nor Fade and LevelStep below; FirstFade is the
; plugin's own ramp. The controller makes no call on the loops it offers (its crossfade waits for
; the answer) or that the plugin drives, so this plugin and CMB_ControllerScript go together:
; test 46's script with an older plugin leaves the nine loops it adds silent, test 45's script
; with this plugin overwrites the levels with the bare engine volume (its SetInstanceVolume sets
; the same value) at its first look and at each MCM change. The harness, with the game's rule for
; both: the loops' power sum within 0.06 dB of the level asked through a pull from rest (6 family
; switches, 7 hand-overs), never under -1 dB, where FadeTo's came down to about -35 dB, 1.3 s of
; the 8 under -10 dB. More calls than FadeTo's (a level moving 0.001 sends; each only posts a
; message). No FadeTo fallback: a library without SetVolume declines every set (Library above).
