LandStop=0.25
; The game's own hard landing (the 2026-11-01a build; test 47: "character still stops/stutters
; when jumping off high ledge"). Off a 4 m drop at full speed the bike fell to about half its
; speed for 0.7 s (937 -> 486) with the throttle held: for a fall that high the game sends the
; player's animation graph its hard landing, a state that moves the player by the landing clip,
