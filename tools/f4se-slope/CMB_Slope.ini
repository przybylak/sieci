; clip plays. Empty = nothing sent (the 2026-11-08a build). Read again on getting on.
UseListen=2.0
UseStop=IdleStop,IdleForceDefaultState
; Sliding along a face (test 42, riding beside a railing: once the capsule grazed the rail the
; game kept about half the speed, 850 -> 358 and 683 -> 338 with the input at full, and the
