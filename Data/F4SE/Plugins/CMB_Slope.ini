[Parts]
; The moving parts of the Sketchfab build (the wheels spin with the distance ridden, back when
; reversing; the bar assembly turns with the rider's turning, and the riding clips put the
; hands where the turned bars are). Where the axles, the steering axis and (since the 2026-10-31a
; build) the speedometer's needle (NeedlePoint, NeedleAxis, NeedleZero, NeedleMax, NeedlePerMph;
; without the first two the needle stays at rest) are comes from CMB_BikeParts.ini, which the mesh
; tool (tools/rider) writes next to the meshes (Data\Meshes\CMB); File= is its path relative to this
; DLL's folder, and the keys can also go in this section instead. Without the file nothing on the
; bike moves (the vanilla bike, a single shape, never does). BarFullAt: the turning rate (degrees a
; second) at which the bars are fully over (BarAngle in the parts file, 10 by default); only a real
; turn takes them all the way (test 22: at 45 every heading correction did, and the straight-riding
; clips' hands came off the grips); a creep turn from a stop is 60 a second, two thirds. Backing up
; with a side key the rear goes the key's way and the nose the other, as a car reverses, so the bars
; turn the key's way, where the front wheel points (test 38: they followed the nose, "when going
; back and turning left motorcycle handlebars should also turn left").
File=..\..\Meshes\CMB\CMB_BikeParts.ini
BarFullAt=90
; At speed the bars go over this much of BarAngle (full to 150 units a second, down to this
; by 400): a bike's bars barely move at speed, and the riding clips' lean poses (jog and up)
; put the hands where the bars are at this fraction.
BarAtSpeed=0.6
; Which part each of the worn bike's shapes is (28 shapes since the 2026-10-31a build, one per
; material and moving part; 27c had 12): 1 = by the tag in its name first, the mesh tool's labels
; (_static_ a fixed part, _rear_tail and _rear_brake the lights' shells, _front_ the bar assembly,
; _front_glow the lamp's lit parts, _front_dialglow the dial's backlight, _front_needle the needle,
; _front_mirrorStock, _front_mirrorUnderEgg and _front_mirrorUnderD the mirrors, _fork the lower
; fork, _wheelF and _wheelR the wheels), then a name without a tag by 27c's rules; 27c's names give
; 27c's parts either way, so its meshes copied back over look and move as 27c's. 0 = 27c's rules
; alone: only _fork by name, the rest by where each shape's culling sphere sits (on an axle a wheel,
; ahead of FrontMinY the bar assembly, small and by the lamp the lamp's lit parts); with this
; build's meshes the needle then stays at rest, and the lights, the dial's backlight and all three
; mirrors always show, whatever the [Speedo], [Tail] and [Look] keys say (0 is for 27c's meshes).
; Up to 48 of the bike's shapes are held (16 before this build); the log names any past that, once
; a ride.
RolesByName=1
; 2026-11-09a (test 50: "the wheels should lock when braking and stop with the bike"). WheelSpin: the wheels turn by
; the bike's own movement each frame along its heading (exact rolling), so they stop on the frame the bike stops, and
; not at all under WheelStill (units a second, 0-50: the capsule's settling jitter); without the steering, by the
; quick speed. 0 = by the 0.2 s speed, the 2026-11-08a build (they ran on after a stop). WheelLock: no turning while
; braking (the back key or the brake key at speed; reversing turns them backward as before). 0 = they turn while braking
; (the 2026-11-08a build). The speedometer's needle keeps its easing ([Speedo] Tau). Read again on getting on.
WheelSpin=1
WheelStill=5
WheelLock=1

[Lamp]
; The headlamp (test 29's wish). The lens's lit parts are a shape of the bar assembly
; (CMB_BikeWorn*.nif), shrunk to a speck while the lamp is off (since the 2026-10-31a build the
; speedometer's backlight with them: [Speedo] Backlight). The beam is the light reference
; the controller script places at the rider on getting on, enabled while CMB_HeadlampLive is 1
; (the MCM's Headlamp: off, on, or on at night; the hotkey switches it while riding): the plugin
; puts its 3D at the lens every frame, with the bars' turn and the tilt, Ahead units out along
; the beam, and hands it over to the new reference the script places on a cell change (tests
; 32 to 35: no blackouts, with or without shadows). The other way, a lamp piece (an unskinned
; nif in biped slot 58 carrying the ADDN records' add-on nodes, which the plugin would keep at
; the lens the same way) never reached the player's 3D in tests 32 to 35 and is gone from the
; mod; the plugin still looks for add-on nodes on the worn bike's nif and would keep one at
; the lens, but no nif carries any now. Enabled=0 leaves the light alone. The log's "lamp:"
; lines say where the lens was put and what was handed over.
Enabled=1
; Only for a kept add-on node, should a worn nif carry some: 1 = the shadow-casting light's
; node, 0 = the plain one's (the placed reference follows the MCM's "Headlamp casts shadows"
; instead).
Shadows=0
; Which of the node's own axes the beam runs along (x, y or z, a - in front for the other way).
; Gamebryo's lights shine down their node's +X. If the beam goes sideways or up, change this.
BeamAxis=x
; The beam dipped this many degrees (a bike's dipped beam: 2 to 4).
Pitch=2
; The light is placed this many units ahead of the lens along the beam (test 34: the beam
; blacked out for a frame when the light fell inside the lamp housing on fast frames; out
; there it lights the same and the housing can't swallow it).
Ahead=28
; The light is also moved on by this many frames of the bike's speed along the heading (the
; renderer uses the transform a frame late). 0 = none.
Lead=1
; 2026-11-15b (test 54: the plugin's task runs twice a game frame, the second right after the first). FrameLead: Lead's
; frames are the game's own (the time between the tasks that begin one), for this lamp and the tail lamp's light; with
; the task twice a frame the second task's interval, the one drawn, was about 0 and the light led by nothing. 0 = the
; task's own interval (2026-11-15a).
FrameLead=1
; At a handover the old light is kept at the lens this many frames after the new one has
; its 3D (the renderer lights with a new 3D a few frames after it exists).
HandoverFrames=5
; Where NiAVObject keeps its flags (bit 0 hides the node), for this game version's layout
; (1.11.240: +0x108; +0x100 is the collision object, test 30).
FlagsOffset=0x108

[Speedo]
; The speedometer (the 2026-10-31a build; "if possible with actually working speedometer"): the
; dial's needle turns clockwise with the speed along the heading, from its rest at the 0 mark
; (NeedleZero past it), NeedlePerMph degrees a dial mph up to NeedleMax, about NeedleAxis through
; the hub (NeedlePoint; the keys are CMB_BikeParts.ini's), then with the bars and the tilt like the
; rest of the bar assembly. The trace's "parts:" line says where (ndl=, degrees). 0 = the needle
; shrunk to a speck at its hub, as 27c had none.
Needle=1
; The dial reads the speed times this. The bike's top speed, 900 units a second, is 28.8 mph (a
; unit is 1.43 cm); 1.75 puts it at about 50 on the dial (0 to 80), which is how fast the ride looks
; and sounds; 1 = the true speed.
Scale=1.75
; The needle follows the speed over this many seconds (0 = at once; the speed itself is measured
; over 0.2 s).
Tau=0.3
; 1 = the dial's backlight lit with the headlamp (the MCM's Headlamp, its hotkey), 0 = never lit
; (27c's dial). The needle's own paint glows faintly all the time, lamp or not (its material's glow
; map, the blade only, so it reads at night); it goes with the needle at Needle=0.
Backlight=1

[Tail]
; The tail light (the 2026-10-31a build): the running light (a lit shell over the red lens, a deep
; red) lit all the time you ride; 0 = the plain lens, as 27c's.
Glow=1
; The brake light (a shell over the tail lens and both rear signals, red, about three times the
; running light's brightness) lit while braking: with the input hook, the back key while going
; forward faster than 10 units a second (the engine's sound reads braking the same way); without it,
; the bike losing more than 1000 units a second each second (the game's coast loses 450, its brake
; 2250: lit about a third of a second in). The trace's "parts:" line says brk=1 while lit. 0 = never
; lit.
Brake=1
; And kept lit this many seconds after (0 = only while braking; a let-go key is still read for
; 0.2 s and counts for 0.1 s more, so at 0.3 the light goes out about 0.6 s after the key).
BrakeHold=0.3

[TailLight]
; The tail lamp's light (2026-11-01a; test 47: "you can tell it's on, but it's not producing light"):
; the lens's lit shell glows, but a glowing material lights nothing in this game, so the controller
; script places a small light (CMB_TailLight: a shadowless red spot, radius 220, about 3 m) and the
; plugin keeps it at the lamp every frame, as it does the headlamp's: aimed back and down so it lights
; the road behind, the plate and the fender's tip, not the rider's back. It is lit while the running
; light is ([Tail] Glow=1) or the brake light is, and brightens with the brake light. The MCM's
; Headlamp page, "Tail lamp lights the road", decides whether the script places it at all (off: as
; the 2026-10-31a build). 0 = the light parked far below, lighting nothing (the 2026-10-31a build's
; look). Read again on getting on, as every key of this section.
Enabled=1
; Where the light sits, "x,y,z" in the bike's own space (empty: the tail shell's centre, which the
; plugin reads off the worn bike: (0.33, -64.22, 54.31) on this build's bike).
Point=
; The light this many units behind the lens along its beam (outside the lamp's housing, which would
; shadow it; 0 = at the lens).
Back=8
; The beam points straight back and this many degrees down. With the 120-degree cone its upper edge
; is 30 degrees above level behind the bike, so the rider (about 150 degrees off the beam) is outside it.
Pitch=30
; The light's colour times this while running, and times BrakeGain while the brake light is lit
; (3 = about three times brighter while braking, as the brake shell over the lens; 1 = no brighter).
RunGain=1
BrakeGain=3
; How the brightness is changed: colour (the light's own colour times the gain) or dimmer (its dimmer
; times the gain). Try dimmer if braking doesn't brighten the pool: CMB_Slope.log then says "tail: the
; game set the light's colour back".
BrakeBy=colour
; Where the game keeps a light's colour (three floats) and its dimmer, for this game version's layout.
ColourOffset=0x12C
DimmerOffset=0x144

[Look]
; The riding bike's mirrors (the 2026-10-31a build): 1 = the stock ones on their stalks over the
; bars (27c's), 2 = hung under the bar ends, egg-shaped, 3 = under the bar ends, D-shaped, 0 = none.
; The parked bike shows the ones fitted at the bike (the stock ones till then). The others are shrunk to specks where they are,
; as every part the plugin hides is. No mirror in this game can show the world behind you (it has no
; render to a texture, and its screen-space reflections can't see behind the camera): the glass
; shows a sky and ground of its own. The plugin hides the other mirrors, turns the needle and
; switches the lights only while it holds the riding bike, which it does when one of the MCM's
; "Steepest slope while riding", "Riding camera distance" and "Bike tilts with the ground" is above
; 0: with all three at 0 every mirror shows, the lights and the dial's backlight stay lit and the
; needle rests, as without the plugin (the wheels and bars stay still too, as in 27c).
; -1 (the default since 2026-11-07a) = as chosen at the bike's field kit (the customisation build: the
; mirrors you fit there, which the parked bike shows too); with nothing chosen there, the stock one.
; 1 = the stock one whatever is chosen at the bike, as 2026-11-06a; 0, 2 and 3 force the others.
Mirrors=-1
; The second customisation build (2026-11-08a): the rims and the licence plate. Rims: 1 (the default) = the
; riding and first-person bikes show the rim style fitted at the bike (the cast rim till one is) and hide the
; other styles as they hide the mirrors; 0 = the plugin hides no rim shape (the materials alone decide what shows),
; as 2026-11-07a. PaintWheel: 1 (the default) = the free paint colour (the MCM's hue) and a body-colour rim's
; colour written into the riding bike's paint and rim materials (F4SE's swap colours the parked bike); 0 = never
; written, as 2026-11-07a. PlateColours: the same for the licence plate's background and letters; 0 = as 2026-11-07a.
;Rims=1
;PaintWheel=1
;PlateColours=1
; 2026-11-09a (test 51's fixes). Six switches the scripts read through CMB_LookOptions (0xBF4, which the plugin writes at
; its start, with these settings and at each getting on; without the plugin the ESP's 63 turns the six on and the scripts
; colour the worn bike themselves), and two of the plugin's own. Each 1 (the default) or 0; 0 = 2026-11-09a as of t54-merge
; (as 2026-11-08a).
; FastMount: the worn bike's items and mods are kept between rides, nothing is attached while the look is unchanged, the
; worn colours come from the plugin (or the F4SE swap once, after the fade), and the parked bike's look work waits for
; getting off. 0 = the worn bike removed at getting off, its mods attached at every equip, the F4SE swaps at the equip
; and again, the parked compose while riding.
FastMount=1
; KitHeld: the field kit's mode counts only after its menu stayed open 2 s, a change was made or you were in the kit; a
; menu that closes at once goes on to the next mode (automatic: the armour bench, then the game's own). 0 = a mode
; remembered on its menu's opening, automatic the toolbox then the armour bench.
KitHeld=1
; ParkedReload: after the MCM's Apply the parked bike's 3D is reloaded, so its new colours show. 0 = no reload.
ParkedReload=1
; PaletteIndex: the parked bike's composed swap gives each palette entry its own colour value (a rim finish its own row).
; 0 = the entries as the material swaps hold them.
PaletteIndex=1
; MountGuard: one activation at a time, no look work before the parked menu or for Ride, getting on waits for the parked
; look work, and a watchdog fades the screen back in at 8 s (gives up at 25 s). 0 = the look before the menu, no guard,
; no watchdog.
MountGuard=1
