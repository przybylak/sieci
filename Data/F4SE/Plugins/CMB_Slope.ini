[Ram]
; Knocking enemies over (test 40's wish; test 41: on by default, smaller robots count, the
; sentry bot and super mutants don't, 10% damage is fine, and the bike should lose speed on a
; hit). An actor the rays see ahead is asked about (CMB_RamSeenHi/Lo/Seen); CMB_RamScript, on
; the controller quest, says yes only to a hostile one that isn't a companion, essential, a
; child, in power armor, of a race in CMB_RamTooBig (the super mutants, the behemoth, the
; sentry bot and the other big ones) or knocked over in the last 3 s. For a yes, at the MCM's
; "Knock over from (speed)" or faster (CMB_RamMinSpeed, 450), the throttle stays open, the
; hit is told just before the front wheel reaches it, the script pushes it away from the rider
; and takes "Knock-over damage" percent of its health (the last of it only with the MCM's
; "Knock-overs can kill", CMB_RamKills, on by default: then a kill, the player's). No answer by
; the hit's Lead point (AskFree, below), a no, too slow (HitGrace) or too big (the robots in
; CMB_RamRobots aside: Robots): braked for as before. Actors stepping in from the side are seen
; within SideRays of the bike's line, fliers by HighRay (below), nothing further out. The log's
; "rams:" lines say each step, the script's "Ram:" lines in the Papyrus log the push and the
; damage.
; Enabled: the developer's switch; the MCM's "Knock enemies over" (CMB_RamEnemies) is the
; player's. 0 = never: no actor is asked about and every one is braked for, as before test 41.
; Read again on getting on, like every key here.
Enabled=1
; The actor ray looks this many seconds of the speed past the front wheel at axle height (720
; units at 900), so the script's answer (its 0.1 s poll and a few engine calls: 100 to 200 ms)
; is in before the face rays' 0.3 s reach (270) gets there.
ActorLook=0.8
; The hit is told this many seconds of the speed before the front wheel's edge reaches the
; actor (54 units at 900): with the script's 30 to 150 ms the push comes between 90 past and
; 18 short of the edge, and the rider's capsule meets the actor some 110 past it.
Lead=0.06
; For this many seconds after the hit the rays let the actor's capsule by (a push that hasn't
; cleared it yet); then it is braked for again.
Pass=1.0
; The largest race size class knocked over: 0 small, 1 medium, 2 large, 3 extra large. The
; plugin reads the race once it has checked the rider's own reads as a playable one of a size
; (its "rams: the rider's race reads" line); CMB_RamTooBig still applies either way.
MaxSize=1
; 1 = a race flagged No Knockdowns is never asked about. The log names the race and its flags
; for every actor refused: should a smaller robot show up there, 0 lets it be asked about.
NoKnockdowns=1
; No answer this many seconds after an ask: asked again. After a no: AskAgainNo seconds (the
; script logs a refusal once in 10 s per actor and reason).
AskAgain=0.4
AskAgainNo=1.0
; Two asks are told to the script this many seconds apart at least (test 41: in packs, a
; second animal seen 46-120 ms after the first replaced the first's ask before the script's
; 0.1 s poll read it, five times; the plugin dropped the first and asked again when it next
; saw it, so no hit was lost, but it was asked twice and answered late). A second actor seen
