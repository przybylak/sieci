; Commonwealth Motorbike - CMB_Slope.dll (F4SE plugin): steeper slopes, a farther camera and
; a bike that tilts with the ground and turns like one while riding, and the ground under you
; for parking the bike.
; How steep, how far, how much: MCM menu ("Steepest slope while riding", "Riding camera
; distance", "Bike tilts with the ground", "Turning radius"...), or in the console
; "set CMB_MaxSlope to 60", "set CMB_RidingCameraDistance to 450", "set CMB_MaxTilt to 15",
; "set CMB_TurnRadius to 180". 0 turns any of them off.
; The log is Documents\My Games\Fallout4\F4SE\CMB_Slope.log.

[Slope]
; Where the slope limit is: in the character controller or its Havok proxy, at which byte
; offset, stored how (cosine, radians or degrees). Found with Probe=1 (tests 5 and 6).
Target=controller
SlopeOffset=0x418
SlopeUnit=cosine
; Only touch it if it holds this angle (degrees) when you get on; 0 = any plausible value.
; A safety check against game updates that move things around.
ExpectedDegrees=47

; 1 = log the controller, the proxy and the objects at these controller offsets, and what
; changes on getting on, 1 and 3 seconds into the ride, and getting off.
Probe=0
DumpPointers=0x2B8

; How often to check, in milliseconds (while riding the limit and the tilt are also kept
; every frame).
IntervalMs=100

[Camera]
; The game setting that says how far back the third-person camera sits.
Setting=fVanityModeMaxDist:Camera
; 1 = on getting on, zoom the third-person camera all the way out (the old zoom comes back
; on getting off). The zoom is a fraction (0 nearest, 1 farthest) at these offsets of the
; game's ThirdPersonState; only written if both read as fractions (the log says).
ZoomOut=1
ZoomTargetOffset=0xE8
ZoomCurrentOffset=0xEC

[Tilt]
; Where the character controller keeps the normal of the ground under the player (its
; support normal) and Havok's character state (0 on the ground, 1 jumping, 2 in the air...).
; In the air the bike eases back to level. 0 = don't read it (the tilt then needs the normal only).
NormalOffset=0x1E0
StateOffset=0x2C0
; The bike's pitch comes from two rays cast down at the wheels' contact patches (the axles
; from CMB_BikeParts.ini; from 70 above the feet to 160 below): the line between the two
; hits, so a lip under the front wheel or a crest lifts the nose the moment a wheel is on it
; (test 29: the track lagged there and the bike sank into slopes). Where a ray finds nothing
; (no Address Library, a ledge) the slope of the track just ridden (the last 120 units, along
; the heading) stands in, and for the first metre of a ride the ground's normal; the roll is
; always the normal's: the median of the last MedianTime seconds (drops one-frame contacts
; with a curb or a lip of rock). When the ground between the wheels is above the capsule's
; contact (a dip, a lip under the front) the bike is lifted onto the rays' line (up to 40
; units), never lowered. The pitch holds in the air (counted only after 50 ms off the
; ground: the state flaps for a frame or two over bumps) and, where the rays miss, standing
; still. Both angles follow their target through a critically damped spring that settles in
; about Smoothing seconds (no overshoot, no saw-tooth when the source changes) and moves at
; most MaxRate degrees a second.
MedianTime=0.25
Smoothing=0.25
MaxRate=90
; Degrees the bike may roll across a slope (a two-wheeler stays upright: 0). Pitch goes up
; to the MCM's "Bike tilts with the ground" (45 by default since test 29, the climb limit:
; at 20 the front wheel went into anything steeper by the difference).
MaxRoll=0
; Leaning into turns (test 31's wish: the rider in line with the bike in bends): the
; centripetal lean, atan(v w / g) for the speed and the turning rate (none at a creep, full
; from 150 units a second), on top of the ground's roll; the rider leans with the bike.
; Test 32: a side key asks 300 degrees a second at once and the lean sat at the cap, jumping
; 18 degrees between quarter seconds. So the turning rate is smoothed over LeanSmooth seconds
; first, v w / g (the tangent of the physical lean) under LeanDead gives nothing (a small
; correction barely leans), the lean is LeanGain of the physical one, at most MaxLean degrees
; (0 = none), and it changes at most LeanRate degrees a second (test 34: 30 lagged the eased
; key turn). All read again on getting on.
MaxLean=14
LeanRate=50
LeanSmooth=0.45
LeanDead=0.08
LeanGain=0.5
; 1 = the head stays level with the horizon as the bike rolls (the face, the eyes and anything
; on the head with it; its pitch still goes with the bike). 0 = the head tilts with the bike.
HeadLevel=1
; The upper body (test 32: the clips pose the arms locked straight, the grips at the arms'
; full reach, so a turn put the far grip out of reach and the wrist stretched). It leans
; forward about the lowest spine bone's joint by TorsoLean degrees (-1 = by enough to bring
; the straight grips to ArmReach of the arms' reach, solved once a ride; 0 = not at all),
; and turns toward the far grip by TorsoTwist of the bars' angle (0 = not at all); the arms
; are solved from the moved shoulders, the hands stay on the grips, the head keeps its pitch.
; Read again on getting on. RiderHands=0 turns these off too.
TorsoLean=-1
ArmReach=0.88
TorsoTwist=0.4
; A bump under a wheel (test 33: the tyres sank into small hills, stones and curbs that passed
; under a wheel before the median and the spring reacted): whichever wheel would sit below its
; own ray's hit, with the pitch and lift as applied, is lifted out. The lift rises over about
; BumpRise seconds (test 34: it lifted 60 units in a frame and launched the bike), never more
; than BumpMax units in one go (a wheel radius), and settles over BumpSettle seconds as the
; filtered pitch and lift catch up or the bump passes. BumpRise=0 or BumpMax=0 turns the bump
; lift off. Read again on getting on.
BumpRise=0.12
BumpMax=30
BumpSettle=0.45
; The bike (and the rider, below) turn about a point this far above the bike's feet ...
PivotHeight=0
; ... and this far ahead of it, towards the bars. 0 and 0: the contact under the rider, so
; the wheels stay on the ground at any pitch (while the rider stayed level the pivot was the
; seat, 74 and 12, to keep the seat under her; the rider goes with the bike now, and about
; the seat the lower wheel went into the slope by 74 x sin(pitch)).
PivotForward=0
; 1 = the rider tilts with the bike (test 23: on a slope the bike pitched and the rider stayed
; level, the hands in the air). The plugin can't turn the skeleton (the animation writes it
; after the plugin runs), so it does what it does for the bike: every skinned shape of the
; player's 3D but the bike's (the body, the outfit, the head, the hair) gets its skin-to-bone
; transforms rewritten each frame so that the mesh lands where the tilt about the pivot would
; put it, through a copy of its bone data that its skin instance is pointed at while riding
; (the game's own is shared with every NPC wearing the same mesh, and is never written); plain
; shapes under the bones (a holstered weapon, the Pip-Boy) get the same through their own
; transform. All or nothing: a skinned shape whose bone data can't be held (test 24: a suit
; with a bone that has no vertices, now accepted) leaves the whole rider level for the ride,
; and the log's "rider:" lines say which shape, its bone and the check; they also list every
; shape held. A bone whose node can't be read, or whose world transform can't be inverted (a
; hidden bone scaled to 0), is simply left as it is, logged with its values; a cloth bone's
; (test 28: the backpack's purse), sheared rather than rigid, is carried along all the same.
; If the game gives a shape a new skin instance (a decal's) or points one back at its own bone
; data, the plugin notices within 0.1 s and holds it again; a decal the game clones from a
; held shape (its skin pointing at the plugin's copy) is held from that shape's own level data.
; 0 = the rider stays level.
Rider=1
; 1 = the rider's hands turn with the bars: the hand and finger bones go round the steering
; axis by the bar angle before the tilt, the forearm bones by a fraction of it (ForeArm3 and
; ForeTwist2 0.8, ForeArm2 0.55, ForeArm1 and ForeTwist1 0.3). The riding clips keep the
; hands at the straight grips in every pose since test 29, so the plugin does all the
; steering of them. 0 = the hands stay at the straight grips.
RiderHands=1
; Test 25 lost about 30 fps with the rider held; test 26 found it was the plugin's memory
; safety checks (one VirtualQuery costs about 100 us on that PC, and there were 39 a frame),
; so since then nothing per frame asks Windows about memory: everything is checked once when
; held, and the cache of known memory regions is kept across frames (emptied on a load, when
; the 3D changes, and every 30 s). Nothing is written while the bike is level either (under
; half a degree; tilted again over one). These four tell apart where any time still goes.
; They're read again every time you get on, so an A/B needs no restart: change them, get off,
; get on. RiderSkinned=0 leaves the skinned shapes (body, outfit, head, hair) alone;
; RiderPlain=0 the plain ones (holstered weapon, Pip-Boy); RiderSwap=0 writes the game's own
; bone data in place instead of pointing the skin at a copy (an experiment only: NPCs wearing
; the same mesh get the rider's tilt); RiderWrite=0 holds (and swaps) but never writes. The
; log's "time:" lines (with Trace=1) give the frame's cost in microseconds: the whole frame,
; the bike's part, the rider's, the skin sync (every 0.1 s) with its memory queries, and how
; many memory queries a frame in all (should read 0).
RiderSkinned=1
RiderPlain=1
RiderSwap=1
RiderWrite=1
; 1 = log the ground and the tilt every 0.25 s while riding (for matching a video to the log).
Trace=1
; The worn bike's shapes start with this name (CMB_BikeWorn, CMB_BikeWornRider, ...RiderF).
Shapes=CMB_BikeWorn
; How the game stores rotation matrices: auto (read off the bike's skin and the player's 3D),
; file or transposed. Only if the log says the two disagree.
Layout=auto

[Steer]
; 1 = while riding, the bike turns at most its speed / the turning radius, or "Turning when
; stopped" degrees a second when that is faster: no spinning round on the spot. The radius
; goes from the MCM's "Turning radius at walking pace" when slow to "Turning radius" (at
; riding speed, 0 = steering off) from FullSpeed units a second up.
Enabled=1
FullSpeed=900
; 1 = change the move keys before the game uses them (the game's MovementHandler is wrapped,
; the log says so), for the two below. 0 = leave them alone: back turns the bike round.
InputHook=1
; A side key alone from a stop (below CreepBelow units a second): the bike turns at "Turning
; when stopped" and creeps forward just fast enough to go round a circle of CreepRadius units
; (55: about 58 units a second at 60 deg/s). CreepInput is the first forward input tried for
; that (it's learnt while riding: rough ground takes more, and a surge once the bike is free
; of something is cut short). Creep=0: it turns on the spot instead.
Creep=1
CreepRadius=55
CreepInput=0.1
CreepBelow=100
; 1 = holding back backs the bike up, facing forward, at BackSpeed units a second; with a
; side key the rear goes that way (the nose the other), as a car reverses. The game's own
; movement only goes forward, so the plugin moves the bike itself: BackPush=auto makes small
; steps, each only after rays (the game's own picking, with the player's collision) find the
; way back clear for BackClearance units: nothing at knee height on either side of the bike or
; at chest height, ground under the rear wheel and just behind the rider (the steps follow
; it, the wheels kept on it). Triggers and other phantoms, and clutter, debris, bodies and
; water, are passed through. A turn is only made if that way is clear too; if not, it backs
; up straight, and if that isn't clear either it stops (the log says what's in the way). Else
; back just brakes. The rays need F4SE's Address Library (version-1-11-240-0.bin in
; Data\F4SE\Plugins, "Address Library for F4SE Plugins"). off = back always brakes; ray,
; delta, mod, velocity or position = only that one (position: steps without rays, through
; walls).
Reverse=1
BackSpeed=80
BackPush=auto
BackClearance=150
; Experiments for the controller saying "in the air" while the bike backs down a slope with
; its wheels on the ground (tests 18, 19): BackSink is how far into the ground the feet go when
; a gap under them is closed (0 = onto it; test 18's 1.5 lost the support more often);
; BackSupportCheck=1 calls the controller's CheckSupportImpl after each step. The log's "rays:"
; lines show the controller's support fields either way.
BackSink=0
BackSupportCheck=0
; The throttle (test 21: the game's own speed is there at once and gone at once). The speed
; builds up over Accel seconds on the forward key (evenly, from a tenth of the top: the game's
; speed for an input of a size bends upward, so the plugin writes the input that gives the
; speed it wants, from test 22's measurements), the bike rolls off over Coast seconds after
; the key, and back brakes it off over Brake seconds before the reverse starts; a side key
; alone creeps only once it's rolled off. Throttle=0: the keys go through as they are.
Throttle=1
Accel=3.0
Coast=2.0
Brake=0.4
; The throttle never runs more than Lead (of the top) ahead of the bike's measured speed
; (test 23: from a stop the game's speed lagged it for a second and then surged to catch up;
; stuck on a hillside with W held it sat at 0.8 and would have lunged once free). 0 = off.
Lead=0.2
; A face ahead (test 32: the down-ray's word came with the face already at the wheel): two
; rays forward along the bike's axis, at axle height and near the top of the front wheel, as
; far as this many seconds of the speed past the front wheel; both hitting at about the same
; distance is a face (a slope under the climb limit puts the upper hit further on), and the
; throttle is eased off with the distance left, to nothing at the wheel. 0 = off.
FaceLook=0.3
; A face this steep or steeper (degrees), solid at axle height and at 1.5 wheel radii, is a
; wall: the throttle eases off to nothing at the wheel (as before).
WallAngle=55
; Anything lower than 1.5 wheel radii at axle height (a fallen tree, a knee-high stone), or
; a face under WallAngle, is an obstacle to ride over: the throttle is held to this share
; and the wheel's bump lift carries the bike over it (test 34's wish). 0 = stop at obstacles
; too.
ObstacleThrottle=0.4
; The turning rate the keys ask for (the whole clamp at once; the mouse asks a little each
; frame) eases in over TurnEaseIn seconds (test 34: 0.35 felt heavy), never beyond the clamp,
; and the heading never overshoots what was asked (test 33: A/D made a snake) ...
TurnEaseIn=0.14
; ... and eases out over TurnEaseOut seconds when the key is let go (the bike stops turning
; almost at once). 0 = at once. Read again on getting on.
TurnEaseOut=0.08
; Back reverses only once the bike moves slower than this (units a second); braked off and
; still rolling on, the game gets nothing until then (test 23: the reverse started at 500 and
; left a roll back after the stop).
BackBelow=30

[Parts]
; The moving parts of the Harley build (the wheels spin with the distance ridden, back when
; reversing; the bar assembly turns with the rider's turning, and the riding clips put the
; hands where the turned bars are). Which shape is what, and where the axles and the steering
; axis are, comes from CMB_BikeParts.ini, which harley_meshes.py writes next to the meshes
; (Data\Meshes\CMB); File= is its path relative to this DLL's folder, and the keys can also
; go in this section instead. Without the file nothing on the bike moves (the vanilla bike,
; a single shape, never does). BarFullAt: the turning rate (degrees a second) at which the
; bars are fully over (BarAngle in the parts file, 10 by default); only a real turn
; takes them all the way (test 22: at 45 every heading correction did, and the straight-riding
; clips' hands came off the grips); a creep turn from a stop is 60 a second, two thirds.
File=..\..\Meshes\CMB\CMB_BikeParts.ini
BarFullAt=90
; At speed the bars go over this much of BarAngle (full to 150 units a second, down to this
; by 400): a bike's bars barely move at speed, and the riding clips' lean poses (jog and up)
; put the hands where the bars are at this fraction.
BarAtSpeed=0.6

[Lamp]
; The headlamp (test 29's wish). The lens's lit parts are a shape of the bar assembly
; (CMB_BikeWorn*.nif), shrunk to a speck while the lamp is off. The beam is a real light, two
; ways at once: the game hangs the ADDN records' lights on the add-on nodes of CMB_BikeLamp.nif
; (an unskinned second addon of the bike's armor: the game keeps an unskinned worn nif's nodes
; and lights them, as the Pip-Boy's, where it kept nothing of the skinned bike's in tests 30 and
; 31), and the plugin puts the node named below at the lens every frame, with the bars' turn
; and the tilt, hiding it (and sinking it far below) while the lamp is off; and the controller
; script places a light reference at the rider on getting on, enabled while CMB_HeadlampLive is
; 1 (the MCM's Headlamp: off, on, or on at night; the hotkey switches it while riding), whose
; 3D the plugin puts at the lens the same way, parked far below while a kept node does the
; lighting. Enabled=0 leaves both alone. The log's "lamp:" lines say what the game attached and
; where the lens was put.
Enabled=1
; For a kept add-on node: 1 = the shadow-casting light's node, 0 = the plain one's (the placed
; reference follows the MCM's "Headlamp casts shadows" instead).
Shadows=0
; Which of the node's own axes the beam runs along (x, y or z, a - in front for the other way).
; Gamebryo's lights shine down their node's +X. If the beam goes sideways or up, change this.
BeamAxis=x
; The beam dipped this many degrees (a bike's dipped beam: 2 to 4).
Pitch=2
; The light is placed this many units ahead of the lens along the beam (test 34: the beam
; blacked out for a frame when the light fell inside the lamp housing on fast frames; out
; there it lights the same and the housing can't swallow it).
Ahead=28
; The light is also moved on by this many frames of the bike's speed along the heading (the
; renderer uses the transform a frame late). 0 = none.
Lead=1
; At a handover the old light is kept at the lens this many frames after the new one has
; its 3D (the renderer lights with a new 3D a few frames after it exists).
HandoverFrames=5
; Where NiAVObject keeps its flags (bit 0 hides the node), for this game version's layout
; (1.11.240: +0x108; +0x100 is the collision object, test 30).
FlagsOffset=0x108
