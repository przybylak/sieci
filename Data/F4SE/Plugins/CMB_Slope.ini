; Commonwealth Motorbike - CMB_Slope.dll (F4SE plugin): steeper slopes and a farther camera
; while riding. How steep and how far: MCM menu ("Steepest slope while riding", "Riding camera
; distance"), or "set CMB_MaxSlope to 60" / "set CMB_RidingCameraDistance to 300" in the console.
; 0 turns either off. The log is Documents\My Games\Fallout4\F4SE\CMB_Slope.log.

[Slope]
; Where the slope limit is: in the character controller or its Havok proxy, at which byte
; offset, stored how (cosine, radians or degrees).
Target=controller
SlopeOffset=0x418
SlopeUnit=cosine
; Only touch it if it holds this angle (degrees) when you get on; 0 = any plausible value.
; A safety check while the place is still being confirmed.
ExpectedDegrees=47

; 1 = log the controller, the proxy and the objects at these controller offsets, and what
; changes on getting on, 1 and 3 seconds into the ride, and getting off.
Probe=1
DumpPointers=0x2B8

; How often to check, in milliseconds (while riding the limit is also kept every frame).
IntervalMs=100

[Camera]
; The game setting that says how far back the third-person camera sits.
Setting=fVanityModeMaxDist:Camera
