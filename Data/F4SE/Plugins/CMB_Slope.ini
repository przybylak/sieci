; Commonwealth Motorbike - CMB_Slope.dll (F4SE plugin): steeper slopes, a farther camera and
; a bike that tilts with the ground while riding, and the ground under you for parking the bike.
; How steep, how far, how much: MCM menu ("Steepest slope while riding", "Riding camera
; distance", "Bike tilts with the ground"), or in the console "set CMB_MaxSlope to 60",
; "set CMB_RidingCameraDistance to 450", "set CMB_MaxTilt to 15". 0 turns any of them off.
; The log is Documents\My Games\Fallout4\F4SE\CMB_Slope.log.

[Slope]
; Where the slope limit is: in the character controller or its Havok proxy, at which byte
; offset, stored how (cosine, radians or degrees). Found with Probe=1 (tests 5 and 6).
Target=controller
SlopeOffset=0x418
SlopeUnit=cosine
; Only touch it if it holds this angle (degrees) when you get on; 0 = any plausible value.
; A safety check against game updates that move things around.
ExpectedDegrees=47

; 1 = log the controller, the proxy and the objects at these controller offsets, and what
; changes on getting on, 1 and 3 seconds into the ride, and getting off.
Probe=0
DumpPointers=0x2B8

; How often to check, in milliseconds (while riding the limit and the tilt are also kept
; every frame).
IntervalMs=100

[Camera]
; The game setting that says how far back the third-person camera sits.
Setting=fVanityModeMaxDist:Camera
; 1 = on getting on, zoom the third-person camera all the way out (the old zoom comes back
; on getting off). The zoom is a fraction (0 nearest, 1 farthest) at these offsets of the
; game's ThirdPersonState; only written if both read as fractions (the log says).
ZoomOut=1
ZoomTargetOffset=0xE8
ZoomCurrentOffset=0xEC

[Tilt]
; Where the character controller keeps the normal of the ground under the player (its
; support normal) and Havok's character state (0 on the ground, 1 jumping, 2 in the air...).
; In the air the bike eases back to level. 0 = don't read it (the tilt then needs the normal only).
NormalOffset=0x1E0
StateOffset=0x2C0
; The bike's pitch is the slope of the track just ridden (the last 120 units, along the
; heading); it holds in the air and standing still. Only for the first metre of a ride, and
; for the roll, the ground's normal is used: the median of the last MedianTime seconds
; (drops one-frame contacts with a curb or a lip of rock). Then both are smoothed over
; Smoothing seconds and changed at most MaxRate degrees a second.
MedianTime=0.25
Smoothing=0.25
MaxRate=90
; Degrees the bike may roll across a slope (a two-wheeler stays upright: 0). Pitch goes up
; to the MCM's "Bike tilts with the ground".
MaxRoll=0
; The bike turns about the seat (the rider's hips, this far above the feet), so the seat and
; the bars stay under the rider, who doesn't tilt.
PivotHeight=74
; 1 = log the ground and the tilt every 0.25 s while riding (for matching a video to the log).
Trace=1
; The worn bike's shapes start with this name (CMB_BikeWorn, CMB_BikeWornRider, ...RiderF).
Shapes=CMB_BikeWorn
; How the game stores rotation matrices: auto (read off the bike's skin and the player's 3D),
; file or transposed. Only if the log says the two disagree.
Layout=auto
